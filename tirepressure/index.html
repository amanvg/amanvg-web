<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tire Pressure — amanvg</title>
    <meta name="description" content="Fill pressure that averages to the door placard over the next 30 days, corrected for temperature and altitude.">
    <meta name="theme-color" content="#24422e">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tire Pressure — amanvg">
    <meta property="og:description" content="Fill pressure that averages to the door placard over the next 30 days, corrected for temperature and altitude.">
    <meta property="og:url" content="https://www.amanvg.com/tirepressure/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Vollkorn:ital,wght@0,400;1,400&family=Work+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Federal Park Serigraph (light) */
:root{
  color-scheme:light;
  --canvas:#f6efe1; --card:#ede3ce; --row-a:#f6efe1; --row-b:#ede3ce;
  --text:#181c16; --muted:#4d5843; --head-bg:#24422e; --head-text:#f6efe1; --head-line:#181c16;
  --key:#4d5843; --frame:#24422e; --divider:rgba(77,88,67,.25);
  --shadow:#181c16; --accent:#d9822b; --focus:#24422e; --sel-bg:#d9822b; --sel-fg:#181c16;
  --btn-hover-bg:#ede3ce; --btn-hover-fg:#24422e;
  --well-bg:#f6efe1; --well-shadow:rgba(24,28,22,.15);
  --live-bg:#a63a24; --live-fg:#f6efe1;
  --act-fg:#24422e; --act-line:#24422e; --act-hover:#f6efe1;
  --pri-bg:#24422e; --pri-fg:#f6efe1; --pri-line:#181c16;
  --s1:#24422e; --s2:#d9822b; --s3:#a63a24;
  --foot-bg:#1c2730; --foot-text:#f6efe1; --foot-line:#181c16; --foot-accent:#d9822b;
  --b-sports:#24422e; --f-sports:#f6efe1;
  --display:'Oswald','Arial Narrow',sans-serif;
  --body:'Vollkorn',Georgia,serif;
  --label:'Work Sans',system-ui,sans-serif;
  --margin:max(40px,calc((100% - 1200px)/2));
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Nocturne Serigraph (dark) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e1511; --card:#1a271f; --row-a:#141e17; --row-b:#1a271f;
  --text:#f4ede2; --muted:#96a498; --head-bg:#141e17; --head-text:#f4ede2; --head-line:#35483b;
  --key:#35483b; --frame:#35483b; --divider:#233328;
  --shadow:#060a08; --accent:#e5933a; --focus:#e5933a; --sel-bg:#e5933a; --sel-fg:#0e1511;
  --btn-hover-bg:#1a271f; --btn-hover-fg:#f4ede2;
  --well-bg:#0a0f0c; --well-shadow:#060a08;
  --live-bg:#ff8168; --live-fg:#3e0400;
  --act-fg:#f4ede2; --act-line:#35483b; --act-hover:#223329;
  --pri-bg:#e5933a; --pri-fg:#0e1511; --pri-line:#060a08;
  --s1:#44805d; --s2:#e5933a; --s3:#c8523b;
  --foot-bg:#0a0f0c; --foot-text:#ded5c5; --foot-line:#35483b; --foot-accent:#e5933a;
  --b-sports:#2d4b38; --f-sports:#f4ede2;
}
html{scrollbar-gutter:stable;scrollbar-color:var(--key) var(--canvas)}
body{background:var(--canvas);color:var(--text);font-family:var(--body);margin:10px;border:2px solid var(--key);min-height:calc(100vh - 20px);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{font:inherit}
[hidden]{display:none!important}

.skip-link{position:absolute;top:-48px;left:16px;background:var(--head-text);color:var(--head-bg);padding:8px 16px;z-index:200;font-family:var(--label);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.skip-link:focus{top:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
header{background:var(--head-bg);border-bottom:3px solid var(--head-line);padding:0 var(--margin);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:36px;letter-spacing:.05em;text-transform:uppercase;color:var(--head-text);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.tools{display:flex;gap:12px}
.btn{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;border:2px solid var(--head-text);color:var(--head-text);background:transparent;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s,color .15s}
:root[data-theme="dark"] .btn{border-color:var(--key)}
@media(hover:hover){
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-fg);box-shadow:4px 4px 0 0 var(--shadow);transform:translate(-2px,-2px)}
:root[data-theme="dark"] .btn:hover{border-color:var(--accent)}
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--shadow)}
.btn:focus-visible{outline-color:var(--head-text)}
.icon-btn{width:44px;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
.stripes{height:7px;background:linear-gradient(var(--s1) 0 3px,var(--s2) 3px 5px,var(--s3) 5px 7px)}

main{flex:1;padding:40px var(--margin) 0}
.sheet{border:3px solid var(--frame);background:var(--card);box-shadow:4px 4px 0 0 var(--shadow)}
.masthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;min-height:76px;padding:12px 28px;background:var(--b-sports);color:var(--f-sports);border-bottom:2px solid var(--head-line)}
.masthead h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:48px;letter-spacing:.04em;text-transform:uppercase}
.units{display:flex;flex-wrap:wrap;gap:8px 16px}
.chips{display:flex}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chips span{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:44px;padding:8px 14px;border:1.5px solid var(--f-sports);font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
.chips label+label span{margin-left:-1.5px}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--sel-fg);position:relative}
.chips input:focus-visible+span{outline:3px solid var(--f-sports);outline-offset:3px;position:relative}
@media(hover:hover){.chips input:not(:checked)+span:hover{background:rgba(246,239,225,.14)}}

.body{display:grid;grid-template-columns:minmax(380px,4fr) minmax(0,7fr);gap:2px;background:var(--head-line)}
.panel{background:var(--card);min-width:0;padding:24px 28px 28px}
.inputs{display:flex;flex-direction:column;gap:26px}
.group{display:flex;flex-direction:column;gap:10px}
.section-label{font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase}

.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;min-width:0}
.stepper button{min-height:48px;border:2px solid var(--act-line);background:transparent;color:var(--act-fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .15s var(--ease),box-shadow .15s var(--ease)}
.stepper button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:square}
.stepper button:first-child{border-right:0}
.stepper button:last-child{border-left:0}
@media(hover:hover){.stepper button:hover{background:var(--act-hover)}}
.stepper button:active{background:var(--act-hover);transform:translate(1px,1px)}
input[type=text]{width:100%;min-width:0;min-height:48px;background:var(--well-bg);color:var(--text);border:2px solid var(--key);border-radius:0;box-shadow:inset 2px 2px 0 0 var(--well-shadow);padding:8px 12px;font-family:var(--body);font-size:22px;line-height:28px;font-variant-numeric:lining-nums tabular-nums;caret-color:var(--accent);transition:border-color .15s,box-shadow .15s}
.stepper input{text-align:center;padding:8px 4px}
input[type=text]::placeholder{color:var(--muted);opacity:.65}
input[type=text]:focus{outline:none;border-color:var(--focus);box-shadow:2px 2px 0 0 var(--focus)}
input[type=text][aria-invalid=true]{border-color:var(--live-bg)}
.stepper input:focus{position:relative;z-index:1}

.row{display:flex;gap:10px}
.row input{flex:1}
.act{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:8px 20px;border:2px solid var(--act-line);background:transparent;color:var(--act-fg);transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.act svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.pri{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-line)}
@media(hover:hover){
.act:hover:not(:disabled){background:var(--act-hover);box-shadow:4px 4px 0 0 var(--shadow);transform:translate(-2px,-2px)}
.act.pri:hover:not(:disabled){background:var(--pri-bg);filter:brightness(1.12)}
:root[data-theme="dark"] .act:hover:not(:disabled){border-color:var(--accent)}
}
.act:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--shadow)}
.act:disabled{opacity:.5;cursor:progress}
.act.small{min-height:44px;padding:6px 14px;font-size:12px;letter-spacing:.06em;align-self:flex-start}

.place{font-family:var(--label);font-weight:600;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;min-height:16px;overflow-wrap:anywhere}
.error-text{display:block;background:var(--live-bg);color:var(--live-fg);padding:6px 12px;font-family:var(--label);font-weight:600;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase}
.error-text[hidden]{display:none}

.results{display:flex;flex-direction:column;gap:28px;transition:opacity .2s}
.results.loading{opacity:.45}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sign{border:3px solid var(--frame);background:var(--well-bg);box-shadow:4px 4px 0 0 var(--shadow);min-width:0}
.sign-head{background:var(--head-bg);color:var(--head-text);border-bottom:2px solid var(--head-line);padding:8px 16px;font-family:var(--display);font-weight:700;font-size:22px;line-height:28px;letter-spacing:.06em;text-transform:uppercase}
.sign-body{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 12px 18px}
.num{display:block;font-family:var(--display);font-weight:700;font-size:clamp(72px,8vw,96px);line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--text)}
.num.strike{animation:strike .34s var(--ease)}
@keyframes strike{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}
.sign-unit{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sign-ref{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;margin-top:12px;min-height:28px;font-family:var(--label);font-weight:600;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase}
.pill{font-weight:700;font-size:12px;line-height:14px;letter-spacing:.08em;padding:5px 12px;border:1.5px solid var(--accent);border-radius:9999px;font-variant-numeric:tabular-nums}
:root:not([data-theme="dark"]) .pill{border-color:var(--frame)}

.ledger-wrap{display:flex;flex-direction:column;gap:8px}
.ledger{width:100%;border-collapse:collapse;font-family:var(--label);font-size:16px;line-height:22px;letter-spacing:.02em;border:2px solid var(--key)}
.ledger th{background:var(--head-bg);color:var(--head-text);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;text-align:right}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger td{padding:9px 14px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ledger tbody tr+tr{border-top:1px solid var(--divider)}
.ledger tbody tr:nth-child(odd){background:var(--row-a)}
.ledger tbody tr:nth-child(even){background:var(--row-b)}
.ledger tbody tr.avg{background:var(--sel-bg);color:var(--sel-fg)}
.ledger td:first-child{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}

footer{margin-top:56px;background:var(--foot-bg);color:var(--foot-text);border-top:3px solid var(--foot-line)}
.sources{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:28px var(--margin) 48px}
.sources b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--foot-accent);margin-right:10px}
.sources a{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--foot-text);padding:6px 14px;border-radius:9999px;color:inherit;text-decoration:none;transition:background .15s,color .15s}
.sources a:focus-visible{outline-color:var(--foot-text)}
@media(hover:hover){.sources a:hover{background:var(--foot-text);color:var(--foot-bg)}}

@media(max-width:960px){
  .body{grid-template-columns:1fr}
}
@media(max-width:700px){
  :root{--margin:16px}
  header{height:56px}
  .brand{font-size:24px;line-height:32px}
  .btn{padding:8px 14px}
  main{padding-top:24px}
  .masthead{padding:12px 16px}
  .masthead h1{font-size:28px;line-height:36px}
  .panel{padding:20px 16px 24px}
  .signs{gap:14px}
  .sign-head{font-size:18px;padding:6px 12px}
  .ledger th,.ledger td{padding:8px 8px}
  body{margin:6px;min-height:calc(100vh - 12px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.num.strike{animation:none}}
    </style>
</head>
<body>
    <a class="skip-link" href="#inputs">Skip to content</a>
    <div class="top">
        <header>
            <a class="brand" href="/">amanvg</a>
            <nav class="tools" aria-label="Main navigation">
                <button class="btn icon-btn" id="mode" type="button" aria-label="Switch to dark mode">
                    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
                    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <a class="btn" href="/trust/">Trust</a>
            </nav>
        </header>
        <div class="stripes"></div>
    </div>
    <main>
        <div class="sheet">
            <div class="masthead">
                <h1>Tire Pressure</h1>
                <div class="units">
                    <div class="chips" role="radiogroup" aria-label="Temperature unit">
                        <label><input type="radio" name="tu" value="f" checked><span>°F</span></label><label><input type="radio" name="tu" value="c"><span>°C</span></label>
                    </div>
                    <div class="chips" role="radiogroup" aria-label="Pressure unit">
                        <label><input type="radio" name="pu" value="psi" checked><span>PSI</span></label><label><input type="radio" name="pu" value="kpa"><span>kPa</span></label><label><input type="radio" name="pu" value="bar"><span>bar</span></label>
                    </div>
                </div>
            </div>
            <div class="body">
                <div class="panel inputs" id="inputs">
                    <div class="group">
                        <div class="section-label" id="placard-label">Cold placard</div>
                        <div class="pair" role="group" aria-labelledby="placard-label">
                            <div class="field">
                                <label for="front">Front</label>
                                <div class="stepper">
                                    <button type="button" data-step="-1" data-for="front" aria-label="Decrease front"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12"/></svg></button>
                                    <input type="text" id="front" inputmode="decimal" autocomplete="off" placeholder="—">
                                    <button type="button" data-step="1" data-for="front" aria-label="Increase front"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12M9 3v12"/></svg></button>
                                </div>
                            </div>
                            <div class="field">
                                <label for="rear">Rear</label>
                                <div class="stepper">
                                    <button type="button" data-step="-1" data-for="rear" aria-label="Decrease rear"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12"/></svg></button>
                                    <input type="text" id="rear" inputmode="decimal" autocomplete="off" placeholder="—">
                                    <button type="button" data-step="1" data-for="rear" aria-label="Increase rear"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12M9 3v12"/></svg></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="group">
                        <div class="section-label">Location</div>
                        <form class="row" id="zip-form">
                            <input type="text" id="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="Zip code" aria-label="Zip code">
                            <button class="act pri" type="submit" id="zip-go">Find</button>
                        </form>
                        <button class="act" type="button" id="locate">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
                            Use my location
                        </button>
                        <div class="place" id="place" aria-live="polite"></div>
                        <div class="error-text" id="error" role="alert" hidden></div>
                    </div>
                    <div class="group">
                        <div class="section-label" id="fill-label">Fill temperature</div>
                        <div class="field">
                            <div class="stepper">
                                <button type="button" data-step="-1" data-for="fill" aria-label="Decrease fill temperature"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12"/></svg></button>
                                <input type="text" id="fill" inputmode="decimal" autocomplete="off" placeholder="—" aria-labelledby="fill-label">
                                <button type="button" data-step="1" data-for="fill" aria-label="Increase fill temperature"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12M9 3v12"/></svg></button>
                            </div>
                        </div>
                        <button class="act small" type="button" id="fill-reset" hidden>Use outdoor</button>
                    </div>
                </div>
                <div class="panel">
                    <div class="results" id="results" aria-live="polite">
                        <div class="signs">
                            <section class="sign" aria-labelledby="sign-front-h">
                                <h2 class="sign-head" id="sign-front-h">Front</h2>
                                <div class="sign-body">
                                    <output class="num" id="num-front">—</output>
                                    <div class="sign-unit" data-unit></div>
                                    <div class="sign-ref" id="ref-front"></div>
                                </div>
                            </section>
                            <section class="sign" aria-labelledby="sign-rear-h">
                                <h2 class="sign-head" id="sign-rear-h">Rear</h2>
                                <div class="sign-body">
                                    <output class="num" id="num-rear">—</output>
                                    <div class="sign-unit" data-unit></div>
                                    <div class="sign-ref" id="ref-rear"></div>
                                </div>
                            </section>
                        </div>
                        <div class="ledger-wrap">
                            <div class="section-label" id="ledger-label">Next 30 days</div>
                            <table class="ledger" aria-labelledby="ledger-label">
                                <thead><tr><th scope="col">Day</th><th scope="col">Temp</th><th scope="col">Front</th><th scope="col">Rear</th></tr></thead>
                                <tbody>
                                    <tr id="row-cold"><td>Cold</td><td>—</td><td>—</td><td>—</td></tr>
                                    <tr id="row-avg" class="avg"><td>Average</td><td>—</td><td>—</td><td>—</td></tr>
                                    <tr id="row-warm"><td>Warm</td><td>—</td><td>—</td><td>—</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="stripes"></div>
        <div class="sources"><b>Sources</b><a href="/trust/#sources">Open-Meteo</a><a href="/trust/#sources">Zippopotam.us</a><a href="/trust/#sources">OpenStreetMap</a></div>
    </footer>

    <script>
        // ── Constants ───────────────────────────────────────────

        const HISTORY_YEARS = 10;
        const WINDOW_DAYS = 30;
        const PLACARD_MIN_PSI = 20, PLACARD_MAX_PSI = 80;
        const FILL_MIN_F = -40, FILL_MAX_F = 130;
        const PSI_PER = { psi: 1, kpa: 6.894757, bar: 0.06894757 };
        const STEP = { psi: 0.5, kpa: 5, bar: 0.05 };
        const DEC = { psi: 1, kpa: 0, bar: 2 };
        const UNIT_LABEL = { psi: 'PSI', kpa: 'kPa', bar: 'bar' };
        const ATM_SEA_PSI = 14.6959;
        const STORE_KEY = 'tirepressure.inputs';

        const $ = id => document.getElementById(id);

        // ── State ───────────────────────────────────────────────

        const S = {
            front: null, rear: null,         // placard, psi
            tempU: 'f', pressU: 'psi',
            loc: null,                       // { lat, lon, label, zip }
            weather: null,                   // { nowF, avgF, coldF, warmF, elevM }
            fillF: null,                     // user override, °F; null = outdoor now
            loading: false,
        };
        let requestSeq = 0;

        function save() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                    front: S.front, rear: S.rear, tempU: S.tempU, pressU: S.pressU, loc: S.loc,
                }));
            } catch (e) {}
        }
        function load() {
            try {
                const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
                if (!d) return;
                if (typeof d.front === 'number') S.front = d.front;
                if (typeof d.rear === 'number') S.rear = d.rear;
                if (d.tempU === 'f' || d.tempU === 'c') S.tempU = d.tempU;
                if (d.pressU in PSI_PER) S.pressU = d.pressU;
                if (d.loc && isFinite(d.loc.lat) && isFinite(d.loc.lon)) S.loc = d.loc;
            } catch (e) {}
        }

        // ── Units and physics ───────────────────────────────────

        const psiToDisp = (psi, u) => psi * PSI_PER[u];
        const dispToPsi = (v, u) => v / PSI_PER[u];
        const fToDisp = (f, u) => u === 'f' ? f : (f - 32) * 5 / 9;
        const dispToF = (v, u) => u === 'f' ? v : v * 9 / 5 + 32;
        const rankine = f => f + 459.67;
        const snap = (v, u) => Math.round(v / STEP[u]) * STEP[u];
        const fmtP = (psi, u) => psiToDisp(psi, u).toFixed(DEC[u]);
        const fmtT = (f, u) => `${Math.round(fToDisp(f, u))}°${u.toUpperCase()}`;
        const fmtDelta = (psi, u) => {
            const v = Number(psiToDisp(psi, u).toFixed(DEC[u]));
            return v === 0 ? '±0' : `${v > 0 ? '+' : '−'}${Math.abs(v).toFixed(DEC[u])}`;
        };
        // Standard-atmosphere pressure at elevation h (m), in psi.
        const atmPsi = h => ATM_SEA_PSI * Math.pow(1 - 2.25577e-5 * h, 5.25588);

        // Gauge pressure to fill to at tFillF so the gauge reads placardPsi at tAvgF.
        function fillTarget(placardPsi, tFillF, tAvgF, patm) {
            return (placardPsi + patm) * rankine(tFillF) / rankine(tAvgF) - patm;
        }
        // Gauge reading at tF for a tire filled to fillPsi at tFillF.
        function gaugeAt(fillPsi, tFillF, tF, patm) {
            return (fillPsi + patm) * rankine(tF) / rankine(tFillF) - patm;
        }

        // ── Network ─────────────────────────────────────────────

        async function fetchJson(url) {
            const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
            if (!res.ok) throw new Error(`${res.status}`);
            return res.json();
        }

        async function geocodeZip(zip) {
            let data;
            try { data = await fetchJson(`https://api.zippopotam.us/us/${zip}`); }
            catch (e) { throw new Error('Zip code not found. Check the digits.'); }
            const p = data.places && data.places[0];
            if (!p) throw new Error('Zip code not found. Check the digits.');
            return { lat: parseFloat(p.latitude), lon: parseFloat(p.longitude), label: `${p['place name']}, ${p['state abbreviation']} ${zip}`, zip };
        }

        async function reverseGeocode(lat, lon) {
            try {
                const data = await fetchJson(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10`);
                const a = data.address || {};
                const city = a.city || a.town || a.village || a.county || '';
                const parts = [city, a.state].filter(Boolean);
                if (parts.length) return parts.join(', ');
            } catch (e) {}
            return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
        }

        const pad = n => String(n).padStart(2, '0');
        const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

        function windowKeys() {
            const keys = new Set(), t = new Date();
            for (let i = 0; i < WINDOW_DAYS; i++) {
                const x = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i);
                keys.add(`${pad(x.getMonth() + 1)}-${pad(x.getDate())}`);
            }
            return keys;
        }

        async function fetchHistory(lat, lon) {
            const today = isoDay(new Date());
            const prefix = 'tirepressure.hist.';
            const key = `${prefix}${lat.toFixed(2)}.${lon.toFixed(2)}.${today}`;
            try {
                const cached = localStorage.getItem(key);
                if (cached) return JSON.parse(cached);
            } catch (e) {}
            const y = new Date().getFullYear();
            const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}`
                + `&start_date=${y - HISTORY_YEARS}-01-01&end_date=${y - 1}-12-31`
                + `&daily=temperature_2m_mean&temperature_unit=fahrenheit&timezone=auto`;
            const data = await fetchJson(url);
            const keys = windowKeys(), d = data.daily, vals = [];
            for (let i = 0; i < d.time.length; i++) {
                const v = d.temperature_2m_mean[i];
                if (v != null && keys.has(d.time[i].slice(5))) vals.push(v);
            }
            if (!vals.length) throw new Error('No temperature history for this location.');
            vals.sort((a, b) => a - b);
            const at = q => vals[Math.floor(q * (vals.length - 1))];
            const result = {
                avgF: vals.reduce((s, v) => s + v, 0) / vals.length,
                coldF: at(0.1), warmF: at(0.9),
                elevM: data.elevation, days: vals.length, years: `${y - HISTORY_YEARS}–${y - 1}`,
            };
            try {
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith(prefix) && !k.endsWith(`.${today}`)) localStorage.removeItem(k);
                }
                localStorage.setItem(key, JSON.stringify(result));
            } catch (e) {}
            return result;
        }

        async function fetchCurrent(lat, lon) {
            const data = await fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=fahrenheit&timezone=auto`);
            return { nowF: data.current.temperature_2m, elevM: data.elevation };
        }

        // ── Location and weather ────────────────────────────────

        function showError(msg) { const e = $('error'); e.textContent = msg; e.hidden = !msg; }

        async function loadWeather(loc) {
            const seq = ++requestSeq;
            S.loc = loc; S.loading = true; S.weather = null; S.fillF = null;
            showError('');
            render();
            const [hist, cur] = await Promise.allSettled([fetchHistory(loc.lat, loc.lon), fetchCurrent(loc.lat, loc.lon)]);
            if (seq !== requestSeq) return;
            S.loading = false;
            if (hist.status !== 'fulfilled') {
                showError(`Weather history unavailable. Press Find to retry.`);
                render();
                return;
            }
            const h = hist.value;
            S.weather = {
                nowF: cur.status === 'fulfilled' ? cur.value.nowF : null,
                avgF: h.avgF, coldF: h.coldF, warmF: h.warmF, years: h.years,
                elevM: cur.status === 'fulfilled' && cur.value.elevM != null ? cur.value.elevM : (h.elevM || 0),
            };
            if (cur.status !== 'fulfilled') showError('Current temperature unavailable. Enter the fill temperature.');
            save();
            render();
        }

        async function useZip(zip) {
            if (!/^\d{5}$/.test(zip)) { showError('Enter a 5-digit zip code.'); return; }
            const btn = $('zip-go');
            btn.disabled = true; showError('');
            try { await loadWeather(await geocodeZip(zip)); }
            catch (e) { S.loading = false; showError(e.message); render(); }
            btn.disabled = false;
        }

        function useGeolocation() {
            if (!navigator.geolocation) { showError('Location is not available in this browser. Enter a zip code.'); return; }
            const btn = $('locate');
            btn.disabled = true; showError('');
            navigator.geolocation.getCurrentPosition(async pos => {
                const lat = +pos.coords.latitude.toFixed(2), lon = +pos.coords.longitude.toFixed(2);
                const label = await reverseGeocode(lat, lon);
                btn.disabled = false;
                $('zip').value = '';
                await loadWeather({ lat, lon, label, zip: '' });
            }, err => {
                btn.disabled = false;
                showError(err.code === 1 ? 'Location denied. Enter a zip code.' : 'Location unavailable. Enter a zip code.');
            }, { timeout: 15000, maximumAge: 600000 });
        }

        // ── Inputs ──────────────────────────────────────────────

        const PLACARD_KEYS = ['front', 'rear'];
        const parse = s => { const n = parseFloat(String(s).replace(',', '.').trim()); return isFinite(n) ? n : null; };
        const placardOk = psi => psi != null && psi >= PLACARD_MIN_PSI && psi <= PLACARD_MAX_PSI;

        function readPlacard(key, text) {
            const v = parse(text);
            S[key] = v == null ? null : dispToPsi(v, S.pressU);
        }
        function readFill(text) {
            const v = parse(text);
            S.fillF = v == null ? null : dispToF(v, S.tempU);
        }

        PLACARD_KEYS.forEach(key => {
            const el = $(key);
            el.addEventListener('input', () => { readPlacard(key, el.value); save(); render(); });
            el.addEventListener('change', () => { readPlacard(key, el.value); save(); render(true); });
        });
        $('fill').addEventListener('input', () => { readFill($('fill').value); render(); });
        $('fill').addEventListener('change', () => { readFill($('fill').value); render(true); });
        $('fill-reset').addEventListener('click', () => { S.fillF = null; render(true); });

        document.querySelectorAll('.stepper button').forEach(b => b.addEventListener('click', () => {
            const dir = +b.dataset.step, which = b.dataset.for;
            if (which === 'fill') {
                const cur = effectiveFillF();
                const base = cur == null ? (S.tempU === 'f' ? 60 : 15) : fToDisp(cur, S.tempU);
                S.fillF = dispToF(Math.round(base) + dir, S.tempU);
            } else {
                const cur = S[which];
                const base = cur == null ? psiToDisp(35, S.pressU) : psiToDisp(cur, S.pressU);
                S[which] = dispToPsi(base + dir * STEP[S.pressU], S.pressU);
                save();
            }
            render(true);
        }));

        $('zip-form').addEventListener('submit', e => { e.preventDefault(); useZip($('zip').value.trim()); });
        $('locate').addEventListener('click', useGeolocation);

        document.querySelectorAll('input[name=tu]').forEach(r => r.addEventListener('change', () => { S.tempU = r.value; save(); render(true); }));
        document.querySelectorAll('input[name=pu]').forEach(r => r.addEventListener('change', () => { S.pressU = r.value; save(); render(true); }));

        function effectiveFillF() {
            return S.fillF != null ? S.fillF : (S.weather ? S.weather.nowF : null);
        }

        // ── Render ──────────────────────────────────────────────

        function setNum(id, text) {
            const el = $(id);
            if (el.textContent === text) return;
            el.textContent = text;
            el.classList.remove('strike');
            void el.offsetWidth;
            if (text !== '—') el.classList.add('strike');
        }

        function setCell(rowId, cells) {
            const tds = $(rowId).children;
            cells.forEach((c, i) => { tds[i + 1].textContent = c; });
        }

        function render(syncInputs) {
            const pu = S.pressU, tu = S.tempU;
            document.querySelector(`input[name=pu][value=${pu}]`).checked = true;
            document.querySelector(`input[name=tu][value=${tu}]`).checked = true;
            $('placard-label').textContent = `Cold placard · ${UNIT_LABEL[pu]}`;
            $('fill-label').textContent = `Fill temperature · °${tu.toUpperCase()}`;
            document.querySelectorAll('[data-unit]').forEach(e => { e.textContent = UNIT_LABEL[pu]; });

            // Reflect state into fields the user is not currently typing in.
            PLACARD_KEYS.forEach(key => {
                const el = $(key);
                if (syncInputs || document.activeElement !== el) el.value = S[key] == null ? '' : fmtP(S[key], pu);
                el.setAttribute('aria-invalid', S[key] != null && !placardOk(S[key]) ? 'true' : 'false');
            });
            const fillEl = $('fill'), fillF = effectiveFillF();
            if (syncInputs || document.activeElement !== fillEl) fillEl.value = fillF == null ? '' : String(Math.round(fToDisp(fillF, tu)));
            fillEl.setAttribute('aria-invalid', fillF != null && (fillF < FILL_MIN_F || fillF > FILL_MAX_F) ? 'true' : 'false');
            const hasOutdoor = S.weather && S.weather.nowF != null;
            $('fill-reset').hidden = !(S.fillF != null && hasOutdoor);
            if (hasOutdoor) $('fill-reset').textContent = `Use outdoor ${fmtT(S.weather.nowF, tu)}`;

            if (S.loc && document.activeElement !== $('zip') && !$('zip').value) $('zip').value = S.loc.zip || '';
            if (S.loading) $('place').textContent = 'Loading…';
            else if (S.loc && S.weather) {
                const e = S.weather.elevM, el = tu === 'f' ? `${Math.round(e * 3.28084)} ft` : `${Math.round(e)} m`;
                $('place').textContent = `${S.loc.label} · ${el}`;
            } else $('place').textContent = S.loc ? S.loc.label : '';
            $('results').classList.toggle('loading', S.loading);

            renderResults();
        }

        function renderResults() {
            const w = S.weather, pu = S.pressU, tu = S.tempU;
            const fillF = effectiveFillF();
            const tempOk = fillF != null && fillF >= FILL_MIN_F && fillF <= FILL_MAX_F;
            const patm = w ? atmPsi(w.elevM) : null;
            const fills = {};

            for (const key of PLACARD_KEYS) {
                const placard = S[key];
                if (!w || !tempOk || !placardOk(placard)) {
                    setNum(`num-${key}`, '—');
                    $(`ref-${key}`).innerHTML = '';
                    continue;
                }
                const raw = psiToDisp(fillTarget(placard, fillF, w.avgF, patm), pu);
                const fill = dispToPsi(snap(raw, pu), pu);
                fills[key] = fill;
                setNum(`num-${key}`, fmtP(fill, pu));
                $(`ref-${key}`).innerHTML = `<span>Placard ${fmtP(placard, pu)}</span><span class="pill">${fmtDelta(fill - placard, pu)}</span>`;
            }

            const rows = [['row-cold', w && w.coldF], ['row-avg', w && w.avgF], ['row-warm', w && w.warmF]];
            for (const [id, tF] of rows) {
                if (!w) { setCell(id, ['—', '—', '—']); continue; }
                setCell(id, [
                    fmtT(tF, tu),
                    ...PLACARD_KEYS.map(k => fills[k] == null ? '—' : fmtP(gaugeAt(fills[k], fillF, tF, patm), pu)),
                ]);
            }
            $('ledger-label').textContent = w ? `Next 30 days · ${w.years}` : 'Next 30 days';
        }

        // ── Theme ───────────────────────────────────────────────

        const root = document.documentElement, mode = $('mode');
        const paintMode = () => mode.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        mode.addEventListener('click', () => {
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
            paintMode();
        });
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            let saved = null;
            try { saved = localStorage.getItem('theme'); } catch (x) {}
            if (saved === 'light' || saved === 'dark') return;
            root.dataset.theme = e.matches ? 'dark' : 'light';
            paintMode();
        });
        paintMode();

        // ── Go ──────────────────────────────────────────────────

        load();
        render(true);
        if (S.loc) loadWeather(S.loc);
    </script>
</body>
</html>
