<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amanvg — projects &amp; dashboards</title>
  <meta name="description" content="Personal site of Aman Gandhi — live dashboards, maps, and tools.">
  <meta name="theme-color" content="#24422e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="amanvg — projects &amp; dashboards">
  <meta property="og:description" content="Personal site of Aman Gandhi — live dashboards, maps, and tools.">
  <meta property="og:url" content="https://www.amanvg.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Vollkorn:ital,wght@0,400;1,400&family=Work+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Federal Park Serigraph (light) */
:root{
  color-scheme:light;
  --canvas:#f6efe1; --card:#ede3ce; --row-a:#f6efe1; --row-b:#ede3ce;
  --text:#181c16; --head-bg:#24422e; --head-text:#f6efe1; --head-line:#181c16;
  --key:#4d5843; --frame:#24422e; --divider:rgba(77,88,67,.25);
  --shadow:#181c16; --accent:#d9822b; --focus:#24422e; --sel-bg:#d9822b; --sel-fg:#181c16;
  --hover-bg:#24422e; --hover-fg:#f6efe1; --btn-hover-bg:#ede3ce; --btn-hover-fg:#24422e;
  --s1:#24422e; --s2:#d9822b; --s3:#a63a24;
  --foot-bg:#1c2730; --foot-text:#f6efe1; --foot-line:#181c16; --foot-accent:#d9822b;
  --b-sports:#24422e; --f-sports:#f6efe1;
  --b-personal:#60888f;   --f-personal:#181c16;
  --b-weather:#1c2730; --f-weather:#f6efe1;
  --b-calc:#d9822b;   --f-calc:#181c16;
  --b-sec:#a63a24;    --f-sec:#f6efe1;
  --display:'Oswald','Arial Narrow',sans-serif;
  --body:'Vollkorn',Georgia,serif;
  --label:'Work Sans',system-ui,sans-serif;
  --margin:max(40px,calc((100% - 1200px)/2));
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Nocturne Serigraph (dark) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e1511; --card:#1a271f; --row-a:#141e17; --row-b:#1a271f;
  --text:#f4ede2; --head-bg:#141e17; --head-text:#f4ede2; --head-line:#35483b;
  --key:#35483b; --frame:#35483b; --divider:#233328;
  --shadow:#060a08; --accent:#e5933a; --focus:#e5933a; --sel-bg:#e5933a; --sel-fg:#0e1511;
  --hover-bg:#24422e; --hover-fg:#f4ede2; --btn-hover-bg:#1a271f; --btn-hover-fg:#f4ede2;
  --s1:#44805d; --s2:#e5933a; --s3:#c8523b;
  --foot-bg:#0a0f0c; --foot-text:#ded5c5; --foot-line:#35483b; --foot-accent:#e5933a;
  --b-sports:#2d4b38; --f-sports:#f4ede2;
  --b-personal:#44805d;   --f-personal:#0e1511;
  --b-weather:#141c26; --f-weather:#f4ede2;
  --b-calc:#e5933a;   --f-calc:#0e1511;
  --b-sec:#86301f;    --f-sec:#f4ede2;
}
html{scrollbar-gutter:stable}
body{background:var(--canvas);color:var(--text);font-family:var(--body);margin:10px;border:2px solid var(--key);min-height:calc(100vh - 20px);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}


.skip-link{position:absolute;top:-48px;left:16px;background:var(--head-text);color:var(--head-bg);padding:8px 16px;z-index:200;font-family:var(--label);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.skip-link:focus{top:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
header{background:var(--head-bg);border-bottom:3px solid var(--head-line);padding:0 var(--margin);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:36px;letter-spacing:.05em;text-transform:uppercase;color:var(--head-text)}
h1 a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.tools{display:flex;gap:12px}
.btn{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:8px 22px;border:2px solid var(--head-text);color:var(--head-text);background:transparent;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
:root[data-theme="dark"] .btn{border-color:var(--key)}
@media(hover:hover){
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-fg);box-shadow:4px 4px 0 0 var(--shadow);transform:translate(-2px,-2px)}
:root[data-theme="dark"] .btn:hover{border-color:var(--accent)}
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--shadow)}
.btn:focus-visible{outline-color:var(--head-text)}
.icon-btn{width:44px;padding:0;justify-content:center}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
.stripes{height:7px;background:linear-gradient(var(--s1) 0 3px,var(--s2) 3px 5px,var(--s3) 5px 7px)}

main{flex:1;padding:40px var(--margin) 0}
.plate{position:relative;border:3px double var(--frame);padding:6px;background:var(--card)}
.sign{position:absolute;left:22px;bottom:22px;background:var(--head-bg);color:var(--head-text);border:2px solid var(--accent);box-shadow:4px 4px 0 0 var(--shadow);padding:4px 16px 2px;font-family:var(--display);font-weight:700;font-size:clamp(20px,3.2vw,38px);line-height:1.25;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
:root[data-theme="dark"] .plate{border-color:var(--accent)}
.plate img{display:block;width:100%;height:clamp(110px,13vw,150px);object-fit:cover;object-position:50% 12%;border:2px solid var(--shadow)}

.grid{margin-top:40px;border:3px solid var(--frame);background:var(--card);box-shadow:4px 4px 0 0 var(--shadow)}
.cat+.cat{border-top:2px solid var(--head-line)}
.head{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr 24px;align-items:center;column-gap:16px;width:100%;min-height:76px;padding:0 28px;background:var(--c);color:var(--fg);border-bottom:2px solid var(--head-line)}
.cat:not([data-open="true"]) .head{border-bottom-color:transparent}
.head:focus-visible{outline:3px solid var(--fg);outline-offset:-8px}
@media(hover:hover){.head:hover .chev{translate:3px 0}}
.cat h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:48px;letter-spacing:.04em;text-transform:uppercase}
.chev{width:22px;height:22px;transition:transform .4s var(--ease),translate .2s var(--ease)}
.cat[data-open="true"] .chev{transform:rotate(90deg)}

.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.cat[data-open="true"] .panel{grid-template-rows:1fr}
.panel>ul{overflow:hidden;list-style:none;min-height:0}
li:nth-child(odd) .row{background:var(--row-a)}
li:nth-child(even) .row{background:var(--row-b)}
li+li{border-top:1px solid var(--divider)}
.row{display:grid;grid-template-columns:18px 1fr 22px;align-items:center;column-gap:14px;min-height:60px;padding:0 28px 0 56px;color:var(--text);text-decoration:none;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
@media(hover:hover){.row:hover{background:var(--hover-bg)!important;color:var(--hover-fg);box-shadow:inset -4px -4px 0 0 var(--shadow)}}
.row:active{box-shadow:inset -2px -2px 0 0 var(--shadow)}
.row:focus-visible{outline-offset:-6px}
.pip{width:14px;height:14px;color:var(--c)}
:root[data-theme="dark"] .pip{color:var(--accent)}
@media(hover:hover){.row:hover .pip{color:var(--accent)}}
.row h3{font-family:var(--display);font-weight:600;font-size:22px;line-height:28px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px}
.row h3 em{font-family:var(--body);font-style:italic;font-weight:400;font-size:16px;letter-spacing:0;text-transform:none;opacity:.85}
.go{width:20px;height:20px;transition:transform .2s var(--ease)}
@media(hover:hover){.row:hover .go{transform:translateX(5px)}}
@media(hover:hover){:root[data-theme="dark"] .row:hover h3,:root[data-theme="dark"] .row:hover .go{color:var(--accent)}}

footer{margin-top:56px;background:var(--foot-bg);color:var(--foot-text);border-top:3px solid var(--foot-line)}
.sources{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:28px var(--margin) 48px}
.sources a{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--foot-text);padding:6px 14px;border-radius:9999px}
.sources a{color:inherit;text-decoration:none;transition:background .15s,color .15s}
.sources a:focus-visible{outline-color:var(--foot-text)}
@media(hover:hover){.sources a:hover{background:var(--foot-text);color:var(--foot-bg)}}

@media(max-width:700px){:root{--margin:16px}header{height:56px}h1{font-size:24px;line-height:32px}.btn{padding:8px 14px}main{padding-top:24px}.grid{margin-top:24px}.cat h2{font-size:28px;line-height:36px}.head{padding:0 16px;min-height:64px}.row{padding:0 16px 0 28px}body{margin:6px;min-height:calc(100vh - 12px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <a class="skip-link" href="#projects">Skip to content</a>
  <div class="top">
    <header>
      <h1><a href="/">amanvg</a></h1>
      <nav class="tools" aria-label="Main navigation">
        <button class="btn icon-btn" id="mode" type="button" aria-label="Switch to dark mode">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </header>
    <div class="stripes"></div>
  </div>
  <main id="projects">
    <div class="plate"><img alt="" src="/assets/banner.jpg" width="1700" height="500" fetchpriority="high"><h2 class="sign">Personal Projects</h2></div>
    <div class="grid">
      <section class="cat" data-open="false" style="--c:var(--b-sports);--fg:var(--f-sports)">
        <h2><button class="head" aria-expanded="false">Sports<svg class="chev" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 3l12 11-12 11-3-3 8-8-8-8z" fill="currentColor"/></svg></button></h2>
        <div class="panel"><ul>
          <li><a class="row" href="/seattlesports/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>Seattle Sports</h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
        </ul></div>
      </section>
      <section class="cat" data-open="false" style="--c:var(--b-personal);--fg:var(--f-personal)">
        <h2><button class="head" aria-expanded="false">Personal<svg class="chev" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 3l12 11-12 11-3-3 8-8-8-8z" fill="currentColor"/></svg></button></h2>
        <div class="panel"><ul>
          <li><a class="row" href="/frontier/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>Frontier Maintenance</h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
          <li><a class="row" href="/USStates/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>US States <em>I have been to</em></h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
          <li><a class="row" href="/worldmap/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>Countries <em>I have been to</em></h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
          <li><a class="row" href="/mlbstadiums/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>MLB Stadiums <em>I have seen a game in</em></h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
        </ul></div>
      </section>
      <section class="cat" data-open="false" style="--c:var(--b-weather);--fg:var(--f-weather)">
        <h2><button class="head" aria-expanded="false">Weather<svg class="chev" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 3l12 11-12 11-3-3 8-8-8-8z" fill="currentColor"/></svg></button></h2>
        <div class="panel"><ul>
          <li><a class="row" href="/tempest/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>Tempest Station</h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
        </ul></div>
      </section>
      <section class="cat" data-open="false" style="--c:var(--b-sec);--fg:var(--f-sec)">
        <h2><button class="head" aria-expanded="false">Security<svg class="chev" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 3l12 11-12 11-3-3 8-8-8-8z" fill="currentColor"/></svg></button></h2>
        <div class="panel"><ul>
          <li><a class="row" href="/cve/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>CVE Triage</h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
        </ul></div>
      </section>
      <section class="cat" data-open="false" style="--c:var(--b-calc);--fg:var(--f-calc)">
        <h2><button class="head" aria-expanded="false">Calculators<svg class="chev" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 3l12 11-12 11-3-3 8-8-8-8z" fill="currentColor"/></svg></button></h2>
        <div class="panel"><ul>
          <li><a class="row" href="/commute/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>Commute Cost</h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
          <li><a class="row" href="/tirepressure/"><svg class="pip" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0l7 14H0z" fill="currentColor"/></svg><h3>Tire Pressure</h3><svg class="go" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 11h14l-5-6h5l8 9-8 9h-5l5-6H3z" fill="currentColor"/></svg></a></li>
        </ul></div>
      </section>
    </div>
  </main>
  <footer>
    <div class="stripes"></div>
    <div class="sources"><a href="/trust/">Trust &amp; Sources</a></div>
  </footer>
  <script>
    var still = matchMedia('(prefers-reduced-motion: reduce)');
    var follow = 0;
    function reveal(cat) {
      var panel = cat.querySelector('.panel'), end = performance.now() + (still.matches ? 50 : 600), id = ++follow, stop = false;
      function halt() { stop = true; }
      function done() { removeEventListener('wheel', halt); removeEventListener('touchmove', halt); }
      addEventListener('wheel', halt, { once: true, passive: true });
      addEventListener('touchmove', halt, { once: true, passive: true });
      (function step() {
        if (stop || id !== follow) return done();
        var over = panel.getBoundingClientRect().bottom - (innerHeight - 24);
        var by = Math.min(over, cat.getBoundingClientRect().top - 80);
        if (by > 0) scrollBy(0, by);
        if (performance.now() < end) requestAnimationFrame(step); else done();
      })();
    }
    document.querySelectorAll('.cat').forEach(function (cat, i) {
      var btn = cat.querySelector('.head');
      var panel = cat.querySelector('.panel');
      panel.id = 'panel-' + i;
      btn.setAttribute('aria-controls', panel.id);
      function sync(open) {
        cat.dataset.open = open;
        btn.setAttribute('aria-expanded', open);
        panel.inert = !open;
        if (open) reveal(cat);
      }
      panel.inert = cat.dataset.open !== 'true';
      btn.addEventListener('click', function () { sync(cat.dataset.open !== 'true'); });
    });
    var root = document.documentElement, mode = document.getElementById('mode');
    function paint() { mode.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'); }
    mode.addEventListener('click', function () {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
      paint();
    });
    paint();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (x) {}
      if (saved === 'light' || saved === 'dark') return;
      root.dataset.theme = e.matches ? 'dark' : 'light';
      paint();
    });
  </script>
</body>
</html>
