<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLB Stadiums Visited — amanvg</title>
  <meta name="theme-color" content="#24422e" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Vollkorn:ital,wght@0,400;1,400&family=Work+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
/* Federal Park Serigraph (light) */
:root{
  color-scheme:light;
  --canvas:#f6efe1; --card:#ede3ce; --row-a:#f6efe1; --row-b:#ede3ce;
  --text:#181c16; --muted:#4d5843; --head-bg:#24422e; --head-text:#f6efe1; --head-line:#181c16;
  --key:#4d5843; --frame:#24422e; --divider:rgba(77,88,67,.25);
  --shadow:#181c16; --accent:#d9822b; --focus:#24422e; --sel-bg:#d9822b; --sel-fg:#181c16;
  --btn-hover-bg:#ede3ce; --btn-hover-fg:#24422e;
  --well-bg:#f6efe1; --well-shadow:rgba(24,28,22,.15);
  --s1:#24422e; --s2:#d9822b; --s3:#a63a24;
  --foot-bg:#1c2730; --foot-text:#f6efe1; --foot-line:#181c16;
  --b-sports:#24422e; --f-sports:#f6efe1; --chip-line:rgba(246,239,225,.7); --chip-hover:rgba(246,239,225,.14);
  --seen:#d9822b; --toured:#24422e; --land:#d9cdb0; --land-line:rgba(77,88,67,.55);
  --dot-line:#181c16; --none-fill:#f6efe1; --none-line:#4d5843;
  --display:'Oswald','Arial Narrow',sans-serif;
  --body:'Vollkorn',Georgia,serif;
  --label:'Work Sans',system-ui,sans-serif;
  --margin:max(40px,calc((100% - 1200px)/2));
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Nocturne Serigraph (dark) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e1511; --card:#1a271f; --row-a:#141e17; --row-b:#1a271f;
  --text:#f4ede2; --muted:#96a498; --head-bg:#141e17; --head-text:#f4ede2; --head-line:#35483b;
  --key:#35483b; --frame:#35483b; --divider:#233328;
  --shadow:#060a08; --accent:#e5933a; --focus:#e5933a; --sel-bg:#e5933a; --sel-fg:#0e1511;
  --btn-hover-bg:#1a271f; --btn-hover-fg:#f4ede2;
  --well-bg:#0a0f0c; --well-shadow:#060a08;
  --s1:#44805d; --s2:#e5933a; --s3:#c8523b;
  --foot-bg:#0a0f0c; --foot-text:#ded5c5; --foot-line:#35483b;
  --b-sports:#2d4b38; --f-sports:#f4ede2; --chip-line:rgba(244,237,226,.5); --chip-hover:rgba(244,237,226,.12);
  --seen:#e5933a; --toured:#adcfb6; --land:#1a271f; --land-line:#35483b;
  --dot-line:#060a08; --none-fill:#223329; --none-line:#96a498;
}
html{scrollbar-gutter:stable;scrollbar-color:var(--key) var(--canvas)}
body{background:var(--canvas);color:var(--text);font-family:var(--body);margin:10px;border:2px solid var(--key);min-height:calc(100vh - 20px);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{font:inherit}

.skip-link{position:absolute;top:-48px;left:16px;background:var(--head-text);color:var(--head-bg);padding:8px 16px;z-index:200;font-family:var(--label);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.skip-link:focus{top:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
header{background:var(--head-bg);border-bottom:3px solid var(--head-line);padding:0 var(--margin);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:36px;letter-spacing:.05em;text-transform:uppercase;color:var(--head-text);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.tools{display:flex;gap:12px}
.btn{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;border:2px solid var(--head-text);color:var(--head-text);background:transparent;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s,color .15s}
:root[data-theme="dark"] .btn{border-color:var(--key)}
@media(hover:hover){
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-fg);box-shadow:4px 4px 0 0 var(--shadow);transform:translate(-2px,-2px)}
:root[data-theme="dark"] .btn:hover{border-color:var(--accent)}
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--shadow)}
.btn:focus-visible{outline-color:var(--head-text)}
.icon-btn{width:44px;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
.stripes{height:7px;background:linear-gradient(var(--s1) 0 3px,var(--s2) 3px 5px,var(--s3) 5px 7px)}

main{flex:1;padding:28px var(--margin) 0}
.sheet{border:2px solid var(--frame);background:var(--card)}
.masthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;min-height:76px;padding:12px 28px;background:var(--b-sports);color:var(--f-sports);border-bottom:2px solid var(--head-line)}
.masthead h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:48px;letter-spacing:.04em;text-transform:uppercase}
.mast-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#mine-btn{min-height:44px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 28px;background:var(--card);border-bottom:1px solid var(--key)}
.ctl-tag{font-family:var(--display);font-weight:700;font-size:20px;line-height:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.ctl-tools{display:flex;flex-wrap:wrap;gap:8px}
.ctl-msg{font-family:var(--label);font-weight:700;font-size:14px;line-height:16px;color:var(--s3)}
:root .ctl .btn{color:var(--text);border-color:var(--frame);padding:6px 16px}
:root .ctl .btn:focus-visible{outline-color:var(--focus)}
@media(hover:hover){:root .ctl .btn:hover{background:var(--accent);color:var(--sel-fg);border-color:var(--frame)}}
:root .ctl .btn.arm{background:var(--s3);border-color:var(--s3);color:#f6efe1}
.chips button{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:6px 14px;border:1.5px solid var(--chip-line);background:transparent;color:var(--f-sports);font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chips button.active{background:var(--accent);border-color:var(--accent);color:var(--sel-fg)}
.chips button:focus-visible{outline-color:var(--f-sports)}
@media(hover:hover){.chips button:not(.active):hover{background:var(--chip-hover)}}

.body{display:grid;grid-template-columns:minmax(340px,4fr) minmax(0,7fr);gap:1px;background:var(--key)}
.panel{background:var(--card);min-width:0;padding:24px 28px 28px}
.side{display:flex;flex-direction:column;gap:24px}
.signs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sign{background:transparent;min-width:0;border-bottom:1px solid var(--key)}
.sign-head{display:flex;align-items:center;min-height:56px;background:var(--head-bg);color:var(--head-text);padding:6px 14px;font-family:var(--display);font-weight:700;font-size:17px;line-height:22px;letter-spacing:.06em;text-transform:uppercase}
.sign.hot .sign-head{background:var(--accent);color:var(--sel-fg)}
.sign-body{display:flex;align-items:center;justify-content:center;padding:14px 10px}
.num{font-family:var(--display);font-weight:700;font-size:clamp(44px,4.4vw,64px);line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.num.strike{animation:strike .34s var(--ease)}
@keyframes strike{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}

.keys{background:transparent;border-top:1px solid var(--key);border-bottom:1px solid var(--key)}
.key{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;font-family:var(--label);font-weight:600;font-size:14px;line-height:20px}
.key+.key{border-top:1px solid var(--divider)}

.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--dot-line);background:var(--none-fill)}
.dot.visited,.row.visited .dot{background:var(--seen)}
.dot.toured,.row.toured .dot{background:var(--toured)}
.dot.unvisited,.row.unvisited .dot{border-color:var(--none-line)}
.dot.former,.row.former .dot{background:transparent}
.dot.former.visited,.row.former.visited .dot{border-color:var(--seen)}
.dot.former.toured,.row.former.toured .dot{border-color:var(--toured)}

.map-panel{display:flex}
.map-well{flex:1;display:flex;align-items:center;border:1px solid var(--key);background:var(--well-bg);padding:8px}
#mlb-map{width:100%;height:auto;display:block}
.state-path{fill:var(--land);stroke:var(--land-line);stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.stadium-dot{cursor:pointer;transition:opacity .4s}
.stadium-dot.visited{fill:var(--seen);stroke:var(--dot-line)}
.stadium-dot.toured{fill:var(--toured);stroke:var(--dot-line)}
.stadium-dot.unvisited{fill:var(--none-fill);stroke:var(--none-line)}
.stadium-dot.former.visited{fill:var(--well-bg);stroke:var(--seen)}
.stadium-dot.former.toured{fill:var(--well-bg);stroke:var(--toured)}
.stadium-dot:hover{opacity:.75}
.stadium-dot.gone{display:none}
.stadium-dot:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.stadium-dot.hidden{opacity:0;pointer-events:none}

#tooltip{position:fixed;background:var(--card);border:2px solid var(--frame);box-shadow:4px 4px 0 0 var(--shadow);padding:8px 14px;font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;z-index:200;white-space:nowrap}
#tooltip .tip-team{font-family:var(--body);font-weight:400;font-size:15px;line-height:20px;letter-spacing:0;text-transform:none;color:var(--muted)}
#tooltip .tip-status{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;line-height:16px;font-weight:600}
#tooltip .tip-status::before{content:'';width:10px;height:10px;border-radius:50%;border:2px solid var(--dot-line);background:var(--none-fill)}
#tooltip .tip-status.visited::before{background:var(--seen)}
#tooltip .tip-status.toured::before{background:var(--toured)}
#tooltip .tip-status.unvisited::before{border-color:var(--none-line)}

#stadium-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--key)}
.div-card{background:var(--well-bg);min-width:0}
.div-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;background:var(--head-bg);color:var(--head-text);padding:8px 14px;font-family:var(--display);font-weight:700;font-size:20px;line-height:26px;letter-spacing:.06em;text-transform:uppercase}
.div-head .count{font-family:var(--label);font-weight:600;font-size:13px;line-height:16px}
.ledger{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px}
.row+.row{border-top:1px solid var(--divider)}
.row:nth-child(odd){background:var(--row-a)}
.row:nth-child(even){background:var(--row-b)}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-family:var(--label);font-weight:600;font-size:14px;line-height:20px}
.who i{font-style:normal;font-size:15px;line-height:20px;color:var(--muted)}
.row.pick{cursor:pointer}
.row.pick:focus-visible{outline-offset:-3px}
@media(hover:hover){.row.pick:hover{box-shadow:inset 4px 0 0 0 var(--accent)}}
.signs.mine .sign:last-child{grid-column:1/-1}
.former-card{grid-column:1/-1}
.former-card .ledger{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.former-card .row+.row{border-top:0;border-left:1px solid var(--divider)}

footer{margin-top:56px;background:var(--foot-bg);color:var(--foot-text);border-top:3px solid var(--foot-line)}
.sources{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:28px var(--margin) 48px}
.sources a{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--foot-text);padding:6px 14px;border-radius:9999px;color:inherit;text-decoration:none;transition:background .15s,color .15s}
.sources a:focus-visible{outline-color:var(--foot-text)}
@media(hover:hover){.sources a:hover{background:var(--foot-text);color:var(--foot-bg)}}

@media(max-width:1180px){
  .body{grid-template-columns:minmax(300px,4fr) minmax(0,7fr)}
  .signs{gap:12px}
  .sign-head{font-size:15px;padding:6px 10px}
}
@media(max-width:960px){
  .body{grid-template-columns:1fr}
  .map-panel{order:-1}
  .signs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .signs.mine{grid-template-columns:repeat(3,minmax(0,1fr))}
  .signs.mine .sign:last-child{grid-column:auto}
  #stadium-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .former-card{grid-column:1/-1}
}
@media(max-width:700px){
  :root{--margin:16px}
  header{height:56px}
  .brand{font-size:24px;line-height:32px}
  .btn{padding:8px 14px}
  main{padding-top:24px}
  .masthead{padding:12px 16px}
  .masthead h1{font-size:28px;line-height:36px}
  .panel{padding:20px 16px 24px}
  .map-well{padding:4px}
  .signs,.signs.mine{grid-template-columns:repeat(2,minmax(0,1fr))}
  .signs.mine .sign:last-child{grid-column:1/-1}
  .ctl{padding:10px 16px}
  .mast-tools{justify-content:flex-start}
  #stadium-list{grid-template-columns:1fr}
  .former-card .ledger{grid-template-columns:1fr}
  .former-card .row+.row{border-left:0;border-top:1px solid var(--divider)}
  body{margin:6px;min-height:calc(100vh - 12px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.num.strike{animation:none}}
  </style>
</head>
<body>
  <a class="skip-link" href="#map">Skip to content</a>
  <div class="top">
    <header>
      <a class="brand" href="/">amanvg</a>
      <nav class="tools" aria-label="Main navigation">
        <button class="btn icon-btn" id="mode" type="button" aria-label="Switch to dark mode">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </header>
    <div class="stripes"></div>
  </div>

  <main>
    <div class="sheet">
      <div class="masthead">
        <h1>MLB Stadiums</h1>
        <div class="mast-tools">
          <div class="chips" id="region-tabs" role="group" aria-label="Division"></div>
          <div class="chips"><button type="button" id="mine-btn">Create your own</button></div>
        </div>
      </div>
      <div class="ctl" id="ctl" hidden>
        <span class="ctl-tag" id="ctl-tag" hidden>Your map</span>
        <div class="ctl-tools" id="ctl-tools" hidden>
          <button class="btn" type="button" id="back-btn">Back to original</button>
          <button class="btn" type="button" id="export-btn">Export</button>
          <button class="btn" type="button" id="import-btn">Import</button>
          <button class="btn" type="button" id="clear-btn">Clear</button>
          <input type="file" id="file-in" accept="application/json,.json" hidden />
        </div>
        <span class="ctl-msg" id="msg" role="status"></span>
      </div>
      <div class="body">
        <div class="panel side">
          <div class="signs" id="signs">
            <div class="sign hot">
              <div class="sign-head">Seen a game</div>
              <div class="sign-body"><div class="num" id="visited-count">—</div></div>
            </div>
            <div class="sign" id="sign-toured">
              <div class="sign-head">Been to, no game yet</div>
              <div class="sign-body"><div class="num" id="toured-count">—</div></div>
            </div>
            <div class="sign">
              <div class="sign-head">Stadiums remaining</div>
              <div class="sign-body"><div class="num" id="unvisited-count">—</div></div>
            </div>
            <div class="sign">
              <div class="sign-head">Of the league</div>
              <div class="sign-body"><div class="num" id="pct">—</div></div>
            </div>
          </div>
          <div class="keys">
            <div class="key"><span class="dot visited"></span>Seen a game</div>
            <div class="key" id="key-toured"><span class="dot toured"></span>Been to, no game yet</div>
            <div class="key"><span class="dot unvisited"></span>Not yet</div>
            <div class="key" id="key-former"><span class="dot former toured"></span>Former park</div>
          </div>
        </div>
        <div class="panel map-panel" id="map">
          <div class="map-well">
            <svg id="mlb-map" viewBox="0 0 960 600" role="img" aria-label="Map of MLB stadiums"></svg>
          </div>
        </div>
      </div>
      <div class="stripes"></div>
      <div id="stadium-list"></div>
    </div>
  </main>

  <footer>
    <div class="stripes"></div>
    <div class="sources">
      <a href="https://d3js.org" target="_blank" rel="noopener">D3</a>
      <a href="https://github.com/topojson/us-atlas" target="_blank" rel="noopener">US Atlas</a>
      <a href="https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html" target="_blank" rel="noopener">US Census</a>
      <a href="/trust/">Trust &amp; Sources</a>
    </div>
  </footer>

  <div id="tooltip">
    <div id="tip-name"></div>
    <div class="tip-team" id="tip-team"></div>
    <div class="tip-status" id="tip-status"></div>
  </div>

  <!-- D3 v7 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
  <!-- TopoJSON -->
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>

  <script>
// Default view: the visited set lives in /mlbstadiums/data/visited.json
let VISITED = new Set();
let loadError = false;

// Stadiums I've been inside, but haven't seen a game at (default view only)
const BEEN_TO = new Set([
  "Coors Field",
  "Wrigley Field",
  "Rate Field",
  "Progressive Field",
  "Oriole Park at Camden Yards",
]);

// Parks that are no longer a team's home, but that I've been to (default view only).
// status: 'visited' = saw a game there, 'toured' = been inside only
const FORMER_PARKS = [
  { stadium: "Oakland Coliseum", team: "Oakland Athletics", city: "Oakland, CA",
    era: "A's home 1968–2024", status: "toured", division: "AL West",
    coords: [-122.2005, 37.7516] },
  { stadium: "Rangers Ballpark in Arlington", team: "Texas Rangers", city: "Arlington, TX",
    era: "Rangers home 1994–2019", status: "toured", division: "AL West",
    coords: [-97.0832, 32.7512] },
];

// Personal mode: a blank set kept in localStorage under STORE_KEY
const STORE_KEY = 'mlbstadiums:mine';
let personal = false;
let mine = new Set();
let stored = false;

function statusOf(s) {
  if (personal) return mine.has(s.stadium) ? 'visited' : 'unvisited';
  if (s.status) return s.status; // former parks carry their own status
  if (VISITED.has(s.stadium)) return 'visited';
  if (BEEN_TO.has(s.stadium)) return 'toured';
  return 'unvisited';
}

// All 30 current MLB stadiums, grouped by division.
// coords are [longitude, latitude].

  'AL West': [

const ALL_STADIUMS = Object.entries(DIVISION_GROUPS)
  .flatMap(([division, list]) => list.map(s => ({ ...s, division })));

const NAMES = new Set(ALL_STADIUMS.map(s => s.stadium));

// {"version":1,"visited":[...]} -> sorted unique known names, or null when the schema is wrong
function parseVisited(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { return null; }
  if (!o || typeof o !== 'object' || o.version !== 1 || !Array.isArray(o.visited)) return null;
  if (!o.visited.every(v => typeof v === 'string')) return null;
  return [...new Set(o.visited.filter(v => NAMES.has(v)))].sort();
}
const payload = set => ({ version: 1, visited: [...set].sort() });

function loadMine() {
  try {
    const t = localStorage.getItem(STORE_KEY);
    const a = t === null ? null : parseVisited(t);
    if (a) { stored = true; return new Set(a); }
  } catch (e) {}
  return new Set();
}
function saveMine() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(payload(mine))); stored = true; } catch (e) {}
}
function toggleMine(name) {
  if (!personal || !NAMES.has(name)) return;
  if (mine.has(name)) mine.delete(name); else mine.add(name);
  importMsg = '';
  saveMine();
  render();
}

// Stats — the league counts track the 30 current parks; the "been to" count
// includes former parks
const total = ALL_STADIUMS.length;
function setNum(id, text) {
  const el = document.getElementById(id);
  if (el.textContent === text) return;
  el.textContent = text;
  el.classList.remove('strike');
  void el.offsetWidth;
  el.classList.add('strike');
}
function renderStats() {
  const visitedCount = personal ? mine.size : ALL_STADIUMS.filter(s => VISITED.has(s.stadium)).length;
  const touredCount = personal ? 0 : BEEN_TO.size + FORMER_PARKS.filter(s => s.status === 'toured').length;
  setNum('visited-count', String(visitedCount));
  setNum('toured-count', String(touredCount));
  setNum('unvisited-count', String(total - visitedCount));
  setNum('pct', Math.round(visitedCount / total * 100) + '%');
}

// Stadium list: one ledger per division — seen a game first, then been-to, then the rest
const STATUS_RANK = { visited: 0, toured: 1, unvisited: 2 };
const listContainer = document.getElementById('stadium-list');

function ledgerCard(title, count, rows, extra) {
  const card = document.createElement('section');
  card.className = 'div-card' + (extra ? ' ' + extra : '');
  const head = document.createElement('h2');
  head.className = 'div-head';
  const t = document.createElement('span'); t.textContent = title;
  const c = document.createElement('span'); c.className = 'count'; c.textContent = count;
  head.append(t, c);
  card.appendChild(head);
  const ledger = document.createElement('div');
  ledger.className = 'ledger';
  rows.forEach(r => {
    const row = document.createElement('div');
    row.className = `row ${r.cls}`;
    row.dataset.key = r.name;
    const dot = document.createElement('span'); dot.className = 'dot';
    const who = document.createElement('span'); who.className = 'who';
    const b = document.createElement('b'); b.textContent = r.name;
    const i = document.createElement('i'); i.textContent = r.sub;
    who.append(b, i);
    row.append(dot, who);
    if (r.pick) {
      row.classList.add('pick');
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.setAttribute('aria-pressed', r.cls === 'visited');
      row.addEventListener('click', () => toggleMine(r.name));
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMine(r.name); }
      });
    }
    ledger.appendChild(row);
  });
  card.appendChild(ledger);
  listContainer.appendChild(card);
}

function renderList() {
  const ae = document.activeElement;
  const keep = ae && ae.dataset && ae.dataset.key && listContainer.contains(ae) ? ae.dataset.key : null;
  listContainer.replaceChildren();
  Object.keys(DIVISION_GROUPS).forEach(division => {
    const sorted = [...DIVISION_GROUPS[division]]
      .sort((a, b) => STATUS_RANK[statusOf(a)] - STATUS_RANK[statusOf(b)] || a.team.localeCompare(b.team));
    const visitedInGroup = sorted.filter(s => statusOf(s) === 'visited').length;
    const touredInGroup = sorted.filter(s => statusOf(s) === 'toured').length;
    const touredNote = touredInGroup ? ` · ${touredInGroup} been to` : '';
    ledgerCard(division, `${visitedInGroup} / ${sorted.length} visited${touredNote}`,
      sorted.map(s => ({ cls: statusOf(s), name: s.stadium, sub: `${s.team} · ${s.city}`, pick: personal })));
  });
  // Former parks section
  if (!personal) {
    ledgerCard('Former Parks', `${FORMER_PARKS.length} been to`,
      FORMER_PARKS.map(s => ({ cls: `former ${s.status}`, name: s.stadium, sub: `${s.era} · ${s.city}` })), 'former-card');
  }
  if (keep) {
    const again = [...listContainer.querySelectorAll('.row')].find(r => r.dataset.key === keep);
    if (again) again.focus();
  }
}

// Tooltip
const tooltip = document.getElementById('tooltip');
const tipName = document.getElementById('tip-name');
const tipTeam = document.getElementById('tip-team');
const tipStatus = document.getElementById('tip-status');

const STATUS_LABEL = {
  visited: 'Seen a game',
  toured: 'Been to, no game yet',
  unvisited: 'Not yet',
};

function showTip(e, s) {
  const status = statusOf(s);
  tipName.textContent = s.stadium;
  tipTeam.textContent = s.era ? `${s.era} · ${s.city}` : `${s.team} · ${s.city}`;
  tipStatus.textContent = STATUS_LABEL[status];
  tipStatus.className = `tip-status ${status}`;
  tooltip.style.opacity = '1';
  moveTip(e);
}
function moveTip(e) {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY - 10) + 'px';
}
function hideTip() { tooltip.style.opacity = '0'; }

// Draw map using US Atlas TopoJSON as a neutral basemap, then stadium markers
const width = 960, height = 600;
const svg = d3.select('#mlb-map').attr('viewBox', `0 0 ${width} ${height}`);
const projection = d3.geoAlbersUsa().scale(1280).translate([width / 2, height / 2]);
const path = d3.geoPath().projection(projection);

// All map layers live in this group so division zoom can transform them together
const mapLayer = svg.append('g');
const BASE_R = 7;

// ── Division zoom ─────────────────────────────────────────────────────────
let currentK = 1;
let curDivision = 'All MLB';
let dotSel = null;

function focusDivision(name) {
  curDivision = name;
  let transform;
  if (name === 'All MLB') {
    currentK = 1;
    transform = 'translate(0,0) scale(1)';
  } else {
    const pts = DIVISION_GROUPS[name].map(s => projection(s.coords)).filter(Boolean);
    const x0 = d3.min(pts, p => p[0]), x1 = d3.max(pts, p => p[0]);
    const y0 = d3.min(pts, p => p[1]), y1 = d3.max(pts, p => p[1]);
    const pad = 60;
    const k = Math.min(6, 0.85 / Math.max((x1 - x0 + pad) / width, (y1 - y0 + pad) / height));
    const tx = width / 2 - k * (x0 + x1) / 2;
    const ty = height / 2 - k * (y0 + y1) / 2;
    currentK = k;
    transform = `translate(${tx},${ty}) scale(${k})`;
  }
  mapLayer.transition().duration(750).ease(d3.easeCubicInOut).attr('transform', transform);
  // Counter-scale markers so dots stay a readable size when zoomed in,
  // and only show the focused division's stadiums
  mapLayer.selectAll('.stadium-dot')
    .classed('hidden', s => name !== 'All MLB' && s.division !== name)
    .transition().duration(750).ease(d3.easeCubicInOut)
    .attr('r', BASE_R / Math.sqrt(currentK))
    .attr('stroke-width', 1.5 / Math.sqrt(currentK));
  syncDots();
}

// Marker state follows the active set; markers are buttons only in personal mode
function syncDots() {
  if (!dotSel) return;
  const had = document.activeElement;
  dotSel
    .classed('visited', s => statusOf(s) === 'visited')
    .classed('toured', s => statusOf(s) === 'toured')
    .classed('unvisited', s => statusOf(s) === 'unvisited')
    .classed('gone', s => personal && !!s.era)
    .sort((a, b) => STATUS_RANK[statusOf(b)] - STATUS_RANK[statusOf(a)])
    .each(function (s) {
      const live = personal && !s.era && (curDivision === 'All MLB' || s.division === curDivision);
      if (personal && !s.era) {
        this.setAttribute('role', 'button');
        this.setAttribute('aria-label', `${s.stadium}, ${s.team}`);
        this.setAttribute('aria-pressed', statusOf(s) === 'visited');
        this.setAttribute('tabindex', live ? '0' : '-1');
      } else {
        ['role', 'aria-label', 'aria-pressed', 'tabindex'].forEach(a => this.removeAttribute(a));
      }
    });
  if (had && had !== document.activeElement && had.isConnected && had.getAttribute('tabindex') === '0') had.focus();
}

const tabsEl = document.getElementById('region-tabs');
['All MLB', ...Object.keys(DIVISION_GROUPS)].forEach(name => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = name === 'All MLB' ? 'active' : '';
  btn.setAttribute('aria-pressed', name === 'All MLB');
  btn.textContent = name;
  btn.addEventListener('click', () => {
    tabsEl.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-pressed', b === btn);
    });
    focusDivision(name);
  });
  tabsEl.appendChild(btn);
});
// ─────────────────────────────────────────────────────────────────────────

d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(us => {
  const states = topojson.feature(us, us.objects.states);

  mapLayer.selectAll('.state-path')
    .data(states.features)
    .enter()
    .append('path')
    .attr('class', 'state-path')
    .attr('d', path);

  // Stadium markers (current + former parks), colored dots on top so they
  // never hide under gray ones
  dotSel = mapLayer.selectAll('.stadium-dot')
    .data([...ALL_STADIUMS, ...FORMER_PARKS])
    .enter()
    .append('circle')
    .attr('class', s => `stadium-dot${s.era ? ' former' : ''}`)
    .attr('cx', s => { const p = projection(s.coords); return p ? p[0] : -100; })
    .attr('cy', s => { const p = projection(s.coords); return p ? p[1] : -100; })
    .attr('r', BASE_R)
    .attr('stroke-width', 1.5)
    .on('mousemove', (e, s) => { showTip(e, s); moveTip(e); })
    .on('mouseleave', hideTip)
    .on('click', (e, s) => { if (!s.era) toggleMine(s.stadium); })
    .on('keydown', (e, s) => {
      if ((e.key === 'Enter' || e.key === ' ') && !s.era) { e.preventDefault(); toggleMine(s.stadium); }
    });
  syncDots();
});

// ── Personal copy ─────────────────────────────────────────────────────────
let importMsg = '';
let armed = null;
const $ = id => document.getElementById(id);
const mineBtn = $('mine-btn'), ctl = $('ctl'), msgEl = $('msg');
const clearBtn = $('clear-btn'), fileIn = $('file-in');

function disarm() {
  clearTimeout(armed);
  armed = null;
  clearBtn.classList.remove('arm');
  clearBtn.textContent = 'Clear';
}
function render() {
  $('signs').classList.toggle('mine', personal);
  $('sign-toured').hidden = personal;
  $('key-toured').hidden = personal;
  $('key-former').hidden = personal;
  mineBtn.textContent = stored ? 'Your map' : 'Create your own';
  mineBtn.classList.toggle('active', personal);
  if (personal) mineBtn.setAttribute('aria-current', 'true'); else mineBtn.removeAttribute('aria-current');
  $('ctl-tag').hidden = !personal;
  $('ctl-tools').hidden = !personal;
  msgEl.textContent = importMsg || (loadError ? 'Visited list failed to load' : '');
  ctl.hidden = !personal && !msgEl.textContent;
  if (!personal) disarm();
  renderStats();
  renderList();
  syncDots();
}

mineBtn.addEventListener('click', () => {
  if (personal) return;
  personal = true;
  importMsg = '';
  render();
});
$('back-btn').addEventListener('click', () => {
  personal = false;
  importMsg = '';
  render();
  mineBtn.focus();
});
$('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(payload(mine), null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mlbstadiums-visited-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('import-btn').addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => {
  const f = fileIn.files && fileIn.files[0];
  fileIn.value = '';
  if (!f) return;
  const fail = () => { importMsg = 'Import failed: invalid file'; render(); };
  if (f.size > 1000000) return fail();
  f.text().then(t => {
    const list = parseVisited(t);
    if (!list) return fail();
    mine = new Set(list);
    importMsg = '';
    saveMine();
    render();
  }, fail);
});
clearBtn.addEventListener('click', () => {
  if (!armed) {
    clearBtn.classList.add('arm');
    clearBtn.textContent = 'Confirm clear';
    armed = setTimeout(disarm, 4000);
    return;
  }
  disarm();
  mine = new Set();
  stored = false;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  importMsg = '';
  render();
});
clearBtn.addEventListener('blur', disarm);

// Default view reads the committed config; personal data stays in this browser
mine = loadMine();
mineBtn.textContent = stored ? 'Your map' : 'Create your own';
fetch('/mlbstadiums/data/visited.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => {
    const a = parseVisited(t);
    if (!a) throw new Error('schema');
    VISITED = new Set(a);
  })
  .catch(() => { loadError = true; })
  .then(render);

// ── Theme ─────────────────────────────────────────────────────────────────
const root = document.documentElement, mode = document.getElementById('mode');
const paintMode = () => mode.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
mode.addEventListener('click', () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  paintMode();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (x) {}
  if (saved === 'light' || saved === 'dark') return;
  root.dataset.theme = e.matches ? 'dark' : 'light';
  paintMode();
});
paintMode();
