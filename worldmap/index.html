<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries Visited — amanvg</title>
  <meta name="theme-color" content="#24422e" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Vollkorn:ital,wght@0,400;1,400&family=Work+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Federal Park Serigraph (light) */
:root{
  color-scheme:light;
  --canvas:#f6efe1; --card:#ede3ce; --row-a:#f6efe1; --row-b:#ede3ce;
  --text:#181c16; --muted:#4d5843; --head-bg:#24422e; --head-text:#f6efe1; --head-line:#181c16;
  --key:#4d5843; --frame:#24422e; --divider:rgba(77,88,67,.25);
  --shadow:#181c16; --accent:#d9822b; --focus:#24422e; --sel-bg:#d9822b; --sel-fg:#181c16;
  --btn-hover-bg:#ede3ce; --btn-hover-fg:#24422e;
  --well-bg:#f6efe1; --well-shadow:rgba(24,28,22,.15);
  --s1:#24422e; --s2:#d9822b; --s3:#a63a24;
  --foot-bg:#1c2730; --foot-text:#f6efe1; --foot-line:#181c16;
  --b-sports:#24422e; --f-sports:#f6efe1; --chip-line:rgba(246,239,225,.7); --chip-hover:rgba(246,239,225,.14);
  --seen:#d9822b; --land:#d9cdb0; --land-line:rgba(77,88,67,.55);
  --dot-line:#181c16; --none-fill:#f6efe1; --none-line:#4d5843;
  --display:'Oswald','Arial Narrow',sans-serif;
  --body:'Vollkorn',Georgia,serif;
  --label:'Work Sans',system-ui,sans-serif;
  --margin:max(40px,calc((100% - 1200px)/2));
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Nocturne Serigraph (dark) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e1511; --card:#1a271f; --row-a:#141e17; --row-b:#1a271f;
  --text:#f4ede2; --muted:#96a498; --head-bg:#141e17; --head-text:#f4ede2; --head-line:#35483b;
  --key:#35483b; --frame:#35483b; --divider:#233328;
  --shadow:#060a08; --accent:#e5933a; --focus:#e5933a; --sel-bg:#e5933a; --sel-fg:#0e1511;
  --btn-hover-bg:#1a271f; --btn-hover-fg:#f4ede2;
  --well-bg:#0a0f0c; --well-shadow:#060a08;
  --s1:#44805d; --s2:#e5933a; --s3:#c8523b;
  --foot-bg:#0a0f0c; --foot-text:#ded5c5; --foot-line:#35483b;
  --b-sports:#2d4b38; --f-sports:#f4ede2; --chip-line:rgba(244,237,226,.5); --chip-hover:rgba(244,237,226,.12);
  --seen:#e5933a; --land:#1a271f; --land-line:#35483b;
  --dot-line:#060a08; --none-fill:#223329; --none-line:#96a498;
}
html{scrollbar-gutter:stable;scrollbar-color:var(--key) var(--canvas)}
body{background:var(--canvas);color:var(--text);font-family:var(--body);margin:10px;border:2px solid var(--key);min-height:calc(100vh - 20px);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{font:inherit}
[hidden]{display:none!important}

.skip-link{position:absolute;top:-48px;left:16px;background:var(--head-text);color:var(--head-bg);padding:8px 16px;z-index:200;font-family:var(--label);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.skip-link:focus{top:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
header{background:var(--head-bg);border-bottom:3px solid var(--head-line);padding:0 var(--margin);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:36px;letter-spacing:.05em;text-transform:uppercase;color:var(--head-text);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.tools{display:flex;gap:12px}
.btn{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;border:2px solid var(--head-text);color:var(--head-text);background:transparent;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s,color .15s}
:root[data-theme="dark"] .btn{border-color:var(--key)}
@media(hover:hover){
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-fg);box-shadow:4px 4px 0 0 var(--shadow);transform:translate(-2px,-2px)}
:root[data-theme="dark"] .btn:hover{border-color:var(--accent)}
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--shadow)}
.btn:focus-visible{outline-color:var(--head-text)}
.icon-btn{width:44px;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
.stripes{height:7px;background:linear-gradient(var(--s1) 0 3px,var(--s2) 3px 5px,var(--s3) 5px 7px)}

main{flex:1;padding:28px var(--margin) 0}
.sheet{border:3px solid var(--frame);background:var(--card);box-shadow:4px 4px 0 0 var(--shadow)}
.masthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;min-height:76px;padding:12px 28px;background:var(--b-sports);color:var(--f-sports);border-bottom:2px solid var(--head-line)}
.masthead h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:48px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:6px 14px;border:1.5px solid var(--chip-line);background:transparent;color:var(--f-sports);font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chips button.active{background:var(--accent);border-color:var(--accent);color:var(--sel-fg)}
.chips button:focus-visible{outline-color:var(--f-sports)}
@media(hover:hover){.chips button:not(.active):hover{background:var(--chip-hover)}}
.mast-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 16px}
.mine{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border:2px solid var(--chip-line);background:transparent;color:var(--f-sports);font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.mine.active{background:var(--accent);border-color:var(--accent);color:var(--sel-fg)}
.mine:focus-visible{outline-color:var(--f-sports)}
.mine:disabled{opacity:.5;cursor:default}
@media(hover:hover){.mine:not(.active):hover{background:var(--chip-hover)}}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 28px;background:var(--well-bg);border-bottom:2px solid var(--head-line)}
.ctrl-label{font-family:var(--display);font-weight:700;font-size:20px;line-height:26px;letter-spacing:.06em;text-transform:uppercase;margin-right:8px}
.ctrl-btns{display:flex;flex-wrap:wrap;gap:8px 12px}
.ctrl .btn{border-color:var(--frame);color:var(--text);padding:8px 16px}
.ctrl .btn:focus-visible{outline-color:var(--focus)}
.ctrl .btn.armed,.ctrl .btn.armed:hover{background:var(--s3);border-color:var(--s3);color:#f6efe1}
.status{padding:8px 28px;background:var(--well-bg);border-bottom:2px solid var(--head-line);font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase}
.status:empty{display:none}
.status.err{color:var(--s3)}

.body{display:grid;grid-template-columns:minmax(340px,4fr) minmax(0,7fr);gap:2px;background:var(--head-line)}
.panel{background:var(--card);min-width:0;padding:24px 28px 28px}
.side{display:flex;flex-direction:column;gap:24px}
.signs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sign{border:3px solid var(--frame);background:var(--well-bg);box-shadow:4px 4px 0 0 var(--shadow);min-width:0}
.sign-head{display:flex;align-items:center;min-height:56px;background:var(--head-bg);color:var(--head-text);border-bottom:2px solid var(--head-line);padding:6px 14px;font-family:var(--display);font-weight:700;font-size:17px;line-height:22px;letter-spacing:.06em;text-transform:uppercase}
.sign.hot{grid-column:1/-1}
.sign.hot .sign-head{background:var(--accent);color:var(--sel-fg)}
.sign-body{display:flex;align-items:center;justify-content:center;padding:14px 10px}
.num{font-family:var(--display);font-weight:700;font-size:clamp(44px,4.4vw,64px);line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.num.strike{animation:strike .34s var(--ease)}
@keyframes strike{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}

.keys{border:2px solid var(--key);background:var(--well-bg);box-shadow:inset 2px 2px 0 0 var(--well-shadow)}
.key{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase}
.key+.key{border-top:1px solid var(--divider)}

.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--dot-line);background:var(--none-fill)}
.dot.visited,.row.visited .dot{background:var(--seen)}
.dot.unvisited,.row.unvisited .dot{border-color:var(--none-line)}

.map-panel{display:flex}
.map-well{flex:1;display:flex;align-items:center;border:2px solid var(--key);background:var(--well-bg);box-shadow:inset 2px 2px 0 0 var(--well-shadow);padding:8px}
#world-map{width:100%;height:auto;display:block}
.land{stroke:var(--land-line);stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .15s}
.land.visited{fill:var(--seen)}
.land.unvisited{fill:var(--land)}
@media(hover:hover){.land:hover{opacity:.75}}
.land:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.borders{fill:none;stroke:var(--land-line);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.ocean{fill:var(--well-bg);stroke:var(--land-line);stroke-width:.8;vector-effect:non-scaling-stroke}
.graticule{fill:none;stroke:var(--divider);stroke-width:.5;vector-effect:non-scaling-stroke}
#tooltip{position:fixed;background:var(--card);border:2px solid var(--frame);box-shadow:4px 4px 0 0 var(--shadow);padding:8px 14px;font-family:var(--label);font-weight:700;font-size:13px;line-height:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;z-index:200;white-space:nowrap}
#tooltip .tip-status{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;line-height:16px;letter-spacing:.08em}
#tooltip .tip-status::before{content:'';width:10px;height:10px;border-radius:50%;border:2px solid var(--dot-line);background:var(--none-fill)}
#tooltip .tip-status.visited::before{background:var(--seen)}
#tooltip .tip-status.unvisited::before{border-color:var(--none-line)}

#lists{display:flex;flex-direction:column;gap:2px;background:var(--head-line)}
.group{background:var(--well-bg);min-width:0}
.group-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;background:var(--head-bg);color:var(--head-text);border-bottom:2px solid var(--head-line);padding:8px 14px;font-family:var(--display);font-weight:700;font-size:20px;line-height:26px;letter-spacing:.06em;text-transform:uppercase}
.group-head .count{font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em}
.ledger{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));background:var(--row-a)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--row-a);box-shadow:inset -1px -1px 0 var(--divider)}
.row.visited{background:var(--row-b)}
button.row{width:100%;border:0;color:inherit;text-align:left;cursor:pointer}
button.row:focus-visible{outline-offset:-3px}
@media(hover:hover){button.row:hover{box-shadow:inset 0 0 0 2px var(--accent)}}
.row b{font-family:var(--label);font-weight:700;font-size:13px;line-height:18px;letter-spacing:.06em;text-transform:uppercase}
.row.unvisited b{font-weight:600;color:var(--muted)}

footer{margin-top:56px;background:var(--foot-bg);color:var(--foot-text);border-top:3px solid var(--foot-line)}
.sources{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:28px var(--margin) 48px}
.sources a{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--foot-text);padding:6px 14px;border-radius:9999px;color:inherit;text-decoration:none;transition:background .15s,color .15s}
.sources a:focus-visible{outline-color:var(--foot-text)}
@media(hover:hover){.sources a:hover{background:var(--foot-text);color:var(--foot-bg)}}

@media(max-width:1180px){
  .body{grid-template-columns:minmax(300px,4fr) minmax(0,7fr)}
  .signs{gap:12px}
  .sign-head{font-size:15px;padding:6px 10px}
}
@media(max-width:960px){
  .body{grid-template-columns:1fr}
  .map-panel{order:-1}
  .signs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sign.hot{grid-column:auto}
}
@media(max-width:700px){
  :root{--margin:16px}
  header{height:56px}
  .brand{font-size:24px;line-height:32px}
  .btn{padding:8px 14px}
  main{padding-top:24px}
  .masthead{padding:12px 16px}
  .mast-tools{justify-content:flex-start}
  .ctrl,.status{padding-left:16px;padding-right:16px}
  .masthead h1{font-size:28px;line-height:36px}
  .panel{padding:20px 16px 24px}
  .map-well{padding:4px}
  .sign.hot{grid-column:1/-1}
  .ledger{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .signs{grid-template-columns:repeat(2,minmax(0,1fr))}
  body{margin:6px;min-height:calc(100vh - 12px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.num.strike{animation:none}}
  </style>
</head>
<body>
  <a class="skip-link" href="#map">Skip to content</a>
  <div class="top">
    <header>
      <a class="brand" href="/">amanvg</a>
      <nav class="tools" aria-label="Main navigation">
        <button class="btn icon-btn" id="mode" type="button" aria-label="Switch to dark mode">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>

  <main>
    <div class="sheet">

          <button class="btn" id="import" type="button">Import</button>
          <button class="btn" id="clear" type="button">Clear</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
      </div>
      <div class="status" id="status" role="status"></div>
      <div class="body">
        <div class="panel side">
          <div class="signs">
            <div class="sign hot">
              <div class="sign-head">Countries visited</div>
              <div class="sign-body"><div class="num" id="visited-count">—</div></div>
            </div>
            <div class="sign">
              <div class="sign-head">Countries remaining</div>
              <div class="sign-body"><div class="num" id="unvisited-count">—</div></div>
            </div>
            <div class="sign">
              <div class="sign-head">Of the world</div>
              <div class="sign-body"><div class="num" id="pct">—</div></div>
            </div>
          </div>
          <div class="keys">
            <div class="key"><span class="dot visited"></span>Visited</div>
            <div class="key"><span class="dot unvisited"></span>Not visited</div>

        <div class="panel map-panel" id="map">
          <div class="map-well">
            <svg id="world-map" viewBox="0 0 960 500" role="img" aria-label="Map of countries visited"></svg>

        </div>
      </div>
      <div class="stripes"></div>
      <div id="lists"></div>
    </div>
  </main>

  <footer>
    <div class="stripes"></div>
    <div class="sources">
      <a href="https://d3js.org" target="_blank" rel="noopener">D3</a>
      <a href="https://github.com/topojson/world-atlas" target="_blank" rel="noopener">World Atlas</a>
      <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>
      <a href="/trust/">Trust &amp; Sources</a>
    </div>
  </footer>

  <div id="tooltip">
    <div id="tip-name"></div>
    <div class="tip-status" id="tip-status"></div>
  </div>

const CONTINENT_OF = {};
for (const [continent, names] of Object.entries(CONTINENT_GROUPS)) {
  names.forEach(n => { CONTINENT_OF[n] = continent; });
}
const CONTINENT_ORDER = [...Object.keys(CONTINENT_GROUPS), 'Other'];

const tooltip = document.getElementById('tooltip');
const tipName = document.getElementById('tip-name');
const tipStatus = document.getElementById('tip-status');

function showTip(e, name) {
  const isV = visited.has(name);
  tipName.textContent = name;
  tipStatus.textContent = isV ? 'Visited' : 'Not visited';
  tipStatus.className = `tip-status ${isV ? 'visited' : 'unvisited'}`;
  tooltip.style.opacity = '1';
  moveTip(e);
}
function moveTip(e) {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY - 10) + 'px';
}
function hideTip() { tooltip.style.opacity = '0'; }

const W = 960, H = 500;
const svg = d3.select('#world-map').attr('viewBox', `0 0 ${W} ${H}`);
const projection = d3.geoNaturalEarth1().scale(153).translate([W / 2, H / 2]);
const pathGen = d3.geoPath().projection(projection);

// All map layers live in this group so continent zoom can transform them together
const mapLayer = svg.append('g');

mapLayer.append('path').datum({type: 'Sphere'}).attr('class', 'ocean').attr('d', pathGen);
mapLayer.append('path').datum(d3.geoGraticule()()).attr('class', 'graticule').attr('d', pathGen);

// ── Continent zoom ────────────────────────────────────────────────────────
// Geographic bounding boxes: [[lonMin, latMin], [lonMax, latMax]]
const CONTINENTS = {
  'World':         null,
  'North America': [[-168, 6],   [-52, 83]],
  'South America': [[-82, -56],  [-34, 13]],
  'Europe':        [[-25, 34],   [45, 72]],
  'Africa':        [[-18, -35],  [52, 38]],
  'Asia':          [[26, -11],   [179, 78]],
  'Oceania':       [[110, -48],  [180, -6]],
};

// Project a geographic box to a pixel-space bounding box by sampling its edges
function pixelBounds([[lon0, lat0], [lon1, lat1]]) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const N = 24;
  for (let i = 0; i <= N; i++) {
    const lon = lon0 + (lon1 - lon0) * i / N;
    const lat = lat0 + (lat1 - lat0) * i / N;
    for (const pt of [[lon, lat0], [lon, lat1], [lon0, lat], [lon1, lat]]) {
      const p = projection(pt);
      if (!p) continue;
      x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]);
      x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
    }
  }
  return [[x0, y0], [x1, y1]];
}

function focusContinent(name) {
  const box = CONTINENTS[name];
  let transform;
  if (!box) {
    transform = 'translate(0,0) scale(1)';
  } else {
    const [[x0, y0], [x1, y1]] = pixelBounds(box);
    const k = Math.min(10, 0.92 / Math.max((x1 - x0) / W, (y1 - y0) / H));
    const tx = W / 2 - k * (x0 + x1) / 2;
    const ty = H / 2 - k * (y0 + y1) / 2;
    transform = `translate(${tx},${ty}) scale(${k})`;
  }
  mapLayer.transition().duration(750).ease(d3.easeCubicInOut).attr('transform', transform);
}

const tabsEl = document.getElementById('continent-tabs');
['World', ...Object.keys(CONTINENTS).filter(n => n !== 'World')].forEach(name => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = name === 'World' ? 'active' : '';
  btn.setAttribute('aria-pressed', name === 'World');
  btn.textContent = name;
  btn.addEventListener('click', () => {
    tabsEl.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-pressed', b === btn);
    });
    focusContinent(name);
  });
  tabsEl.appendChild(btn);
});
// ─────────────────────────────────────────────────────────────────────────

const rowEls = new Map();
let groups = [];

function renderLists() {
  const host = document.getElementById('lists');
  host.textContent = '';
  rowEls.clear();
  groups = [];
  CONTINENT_ORDER.forEach(continent => {
    const base = allNames.filter(n => (CONTINENT_OF[n] || 'Other') === continent);
    if (!base.length) return;
    // Default view: visited first, then alphabetical. Personal view stays alphabetical so rows do not jump.
    const names = personal ? base : [...base.filter(n => visited.has(n)), ...base.filter(n => !visited.has(n))];
    const card = document.createElement('section');
    card.className = 'group';
    const head = document.createElement('h2');
    head.className = 'group-head';
    const title = document.createElement('span');
    title.textContent = continent;
    const count = document.createElement('span');
    count.className = 'count';
    head.append(title, count);
    card.appendChild(head);
    const ledger = document.createElement('div');
    ledger.className = 'ledger';
    names.forEach(name => {
      const row = document.createElement(personal ? 'button' : 'div');
      row.className = 'row';
      if (personal) {
        row.type = 'button';
        row.addEventListener('click', () => toggle(name));
      }
      const dot = document.createElement('span');
      dot.className = 'dot';
      const b = document.createElement('b');
      b.textContent = name;
      row.append(dot, b);
      ledger.appendChild(row);
      rowEls.set(name, row);
    });
    card.appendChild(ledger);
    host.appendChild(card);
    groups.push({ names, countEl: count });
  });
}

function updateAll(animate) {
  const total = allNames.length;
  const vc = allNames.filter(n => visited.has(n)).length;
  landSel.each(function (d) {
    const name = ID_TO_NAME[+d.id];
    const v = !!(name && visited.has(name));
    this.classList.toggle('visited', v);
    this.classList.toggle('unvisited', !v);
    if (personal && name) this.setAttribute('aria-pressed', v);
  });
  rowEls.forEach((el, name) => {
    const v = visited.has(name);
    el.classList.toggle('visited', v);
    el.classList.toggle('unvisited', !v);
    if (personal) el.setAttribute('aria-pressed', v);
  });
  groups.forEach(g => {
    g.countEl.textContent = `${g.names.filter(n => visited.has(n)).length} / ${g.names.length} visited`;
  });
  ['visited-count', 'unvisited-count', 'pct'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.textContent = [vc, total - vc, (total ? Math.round(vc / total * 100) : 0) + '%'][i];
    if (animate) {
      el.classList.remove('strike');
      void el.offsetWidth;
      el.classList.add('strike');
    }
  });
}

// ── Default (config) view and personal copy ──────────────────────────────
const mineBtn = document.getElementById('mine');
const ctrl = document.getElementById('ctrl');
const statusEl = document.getElementById('status');
const clearBtn = document.getElementById('clear');
const importFile = document.getElementById('import-file');
let master = new Set();

function setStatus(msg, err) {
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('err', !!err);
}

function parseVisited(obj) {
  if (!obj || typeof obj !== 'object' || obj.version !== 1 || !Array.isArray(obj.visited)) return null;
  if (!obj.visited.every(v => typeof v === 'string')) return null;
  return new Set(obj.visited.filter(n => master.has(n)));
}
function payload(set) { return { version: 1, visited: [...set].sort() }; }

function loadMine() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw === null) return null;
    return parseVisited(JSON.parse(raw));
  } catch (e) { return null; }
}
function saveMine() {
  mineExists = true;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(payload(mineSet))); } catch (e) {}
}
function dropMine() {
  mineExists = false;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}
function setMine(set) { mineSet = set; if (personal) visited = mineSet; }

function paintPersonal() {
  mineBtn.textContent = personal || mineExists ? 'Your map' : 'Create your own';
  mineBtn.classList.toggle('active', personal);
  mineBtn.setAttribute('aria-pressed', personal);
  ctrl.hidden = !personal;
  svg.attr('role', personal ? 'group' : 'img');
  landSel.each(function (d) {
    const name = ID_TO_NAME[+d.id];
    if (personal && name) {
      this.setAttribute('role', 'button');
      this.setAttribute('tabindex', '0');
      this.setAttribute('aria-label', name);
    } else {
      this.removeAttribute('role');
      this.removeAttribute('tabindex');
      this.removeAttribute('aria-label');
      this.removeAttribute('aria-pressed');
    }
  });
}

function setMode(on) {
  personal = on;
  visited = on ? mineSet : defaultSet;
  resetClear();
  setStatus('');
  hideTip();
  renderLists();
  paintPersonal();
  updateAll(true);
}

function toggle(name) {
  if (!personal || !master.has(name)) return;
  if (mineSet.has(name)) mineSet.delete(name); else mineSet.add(name);
  saveMine();
  setStatus('');
  updateAll(false);
  paintPersonal();
}

let clearTimer = null;
function resetClear() {
  clearTimeout(clearTimer);
  clearTimer = null;
  clearBtn.textContent = 'Clear';
  clearBtn.classList.remove('armed');
}

mineBtn.addEventListener('click', () => { if (!personal) setMode(true); });
document.getElementById('back').addEventListener('click', () => { setMode(false); mineBtn.focus(); });
clearBtn.addEventListener('click', () => {
  if (clearTimer === null) {
    clearBtn.textContent = 'Confirm clear';
    clearBtn.classList.add('armed');
    clearTimer = setTimeout(resetClear, 4000);
  } else {
    resetClear();
    setMine(new Set());
    dropMine();
    setStatus('');
    updateAll(false);
  }
});
clearBtn.addEventListener('blur', resetClear);
document.getElementById('export').addEventListener('click', () => {
  resetClear();
  const blob = new Blob([JSON.stringify(payload(mineSet), null, 2) + '\n'], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `worldmap-visited-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.getElementById('import').addEventListener('click', () => { resetClear(); importFile.click(); });
importFile.addEventListener('change', () => {
  const file = importFile.files && importFile.files[0];
  importFile.value = '';
  if (!file) return;
  const fail = () => setStatus('Import failed: invalid file', true);
  if (file.size > 1000000) { fail(); return; }
  file.text().then(text => {
    const set = parseVisited(JSON.parse(text));
    if (!set) { fail(); return; }
    setMine(set);
    saveMine();
    setStatus(`Imported ${set.size}`);
    updateAll(false);
    paintPersonal();
  }).catch(fail);
});

const visitedReq = fetch(DATA_URL).then(r => {
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).catch(() => null);

Promise.all([d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'), visitedReq]).then(([world, cfg]) => {
  const countries = topojson.feature(world, world.objects.countries);

  landSel = mapLayer.selectAll('.land')
    .data(countries.features)
    .enter()
    .append('path')
    .attr('class', 'land unvisited')
    .attr('d', pathGen)
    .on('mousemove', (e, d) => {
      const name = ID_TO_NAME[+d.id];
      if (name) showTip(e, name);
    })
    .on('mouseleave', hideTip)
    .on('click', (e, d) => {
      const name = ID_TO_NAME[+d.id];
      if (!personal || !name) return;
      toggle(name);
      showTip(e, name);
    })
    .on('keydown', (e, d) => {
      const name = ID_TO_NAME[+d.id];
      if (!personal || !name || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      toggle(name);
    });

  // Borders
  mapLayer.append('path')
    .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
    .attr('class', 'borders')
    .attr('d', pathGen);

  // Build unique sorted country name list from what's actually in the map
  allNames = [...new Set(
    countries.features.map(d => ID_TO_NAME[+d.id]).filter(Boolean)
  )].sort();
  master = new Set(allNames);

  const parsed = parseVisited(cfg);
  if (parsed) defaultSet = parsed;
  else setStatus('Visited list unavailable', true);

  const saved = loadMine();
  if (saved) { mineSet = saved; mineExists = true; }

  visited = defaultSet;
  renderLists();
  paintPersonal();
  updateAll(true);
  mineBtn.disabled = false;
});

// ── Theme ─────────────────────────────────────────────────────────────────
const root = document.documentElement, mode = document.getElementById('mode');
const paintMode = () => mode.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
mode.addEventListener('click', () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  paintMode();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (x) {}
  if (saved === 'light' || saved === 'dark') return;
  root.dataset.theme = e.matches ? 'dark' : 'light';
  paintMode();
});
paintMode();
