    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Vollkorn:ital,wght@0,400;1,400&family=Work+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Federal Park Serigraph (light) */
:root{
  color-scheme:light;
  --canvas:#f6efe1; --card:#ede3ce; --row-a:#f6efe1; --row-b:#ede3ce;
  --text:#181c16; --muted:#4d5843; --head-bg:#24422e; --head-text:#f6efe1; --head-line:#181c16;
  --key:#4d5843; --frame:#24422e; --divider:rgba(77,88,67,.25);
  --shadow:#181c16; --accent:#d9822b; --focus:#24422e; --sel-bg:#d9822b; --sel-fg:#181c16;
  --btn-hover-bg:#ede3ce; --btn-hover-fg:#24422e;
  --well-bg:#f6efe1; --well-shadow:rgba(24,28,22,.15);
  --live-bg:#a63a24; --live-fg:#f6efe1;
  --act-fg:#24422e; --act-line:#24422e; --act-hover:#f6efe1;
  --s1:#24422e; --s2:#d9822b; --s3:#a63a24;
  --foot-bg:#1c2730; --foot-text:#f6efe1; --foot-line:#181c16; --foot-accent:#d9822b;
  --b-sports:#24422e; --f-sports:#f6efe1;
  --ser-temp:#8f4e00; --ser-hum:#60888f; --ser-wind:#24422e; --ser-gust:#a63a24; --ser-press:#4d5843; --ser-uv:#8f4e00; --ser-solar:#a63a24; --ser-rain:#60888f;
  --display:'Oswald','Arial Narrow',sans-serif;
  --body:'Vollkorn',Georgia,serif;
  --label:'Work Sans',system-ui,sans-serif;
  --margin:max(40px,calc((100% - 1200px)/2));
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Nocturne Serigraph (dark) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e1511; --card:#1a271f; --row-a:#141e17; --row-b:#1a271f;
  --text:#f4ede2; --muted:#96a498; --head-bg:#141e17; --head-text:#f4ede2; --head-line:#35483b;
  --key:#35483b; --frame:#35483b; --divider:#233328;
  --shadow:#060a08; --accent:#e5933a; --focus:#e5933a; --sel-bg:#e5933a; --sel-fg:#0e1511;
  --btn-hover-bg:#1a271f; --btn-hover-fg:#f4ede2;
  --well-bg:#0a0f0c; --well-shadow:#060a08;
  --live-bg:#ff8168; --live-fg:#3e0400;
  --act-fg:#f4ede2; --act-line:#35483b; --act-hover:#223329;
  --s1:#44805d; --s2:#e5933a; --s3:#c8523b;
  --foot-bg:#0a0f0c; --foot-text:#ded5c5; --foot-line:#35483b; --foot-accent:#e5933a;
  --b-sports:#2d4b38; --f-sports:#f4ede2;
  --ser-temp:#e5933a; --ser-hum:#8db4bb; --ser-wind:#44805d; --ser-gust:#ff8168; --ser-press:#96a498; --ser-uv:#f0c868; --ser-solar:#e5933a; --ser-rain:#8db4bb;
}
html{scrollbar-gutter:stable;scrollbar-color:var(--key) var(--canvas)}
body{background:var(--canvas);color:var(--text);font-family:var(--body);margin:10px;border:2px solid var(--key);min-height:calc(100vh - 20px);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.skip-link{position:absolute;top:-48px;left:16px;background:var(--head-text);color:var(--head-bg);padding:8px 16px;z-index:200;font-family:var(--label);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.skip-link:focus{top:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
header{background:var(--head-bg);border-bottom:3px solid var(--head-line);padding:0 var(--margin);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.sitenav{display:flex;align-self:stretch;margin-left:auto;list-style:none}
.sitenav>li{position:relative;display:flex;align-items:center}
.sitenav-btn{font-family:var(--label);font-weight:700;font-size:13px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-text);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;min-height:44px;padding:4px 12px 1px}
.sitenav-btn[aria-current="true"]{border-bottom-color:var(--accent)}
.sitenav-btn:focus-visible{outline-color:var(--head-text)}
.sitenav-drop{display:none;position:absolute;top:100%;left:0;min-width:220px;list-style:none;background:var(--canvas);border:1px solid var(--head-line);border-top:3px solid var(--accent);z-index:60}
.sitenav>li[data-open="true"] .sitenav-drop{display:block}
.sitenav>li:last-child .sitenav-drop{left:auto;right:0}
@media(hover:hover){.sitenav>li:hover .sitenav-drop{display:block}.sitenav-btn:hover{border-bottom-color:var(--accent)}}
.sitenav-drop a{display:flex;align-items:center;min-height:44px;padding:8px 16px;font-family:var(--label);font-weight:600;font-size:14px;color:var(--text);text-decoration:none;border-top:1px solid var(--divider)}
.sitenav-drop li:first-child a{border-top:0}
.sitenav-drop a:hover{background:var(--card)}
.sitenav-drop a[aria-current="page"]{color:var(--accent);background:var(--card)}
:root[data-theme="light"] .sitenav-drop a[aria-current="page"]{color:var(--head-bg)}
@media(max-width:960px){
  .top header{flex-wrap:wrap;height:auto;row-gap:0;padding-top:10px}
  .sitenav{order:3;width:100%;margin:0;justify-content:space-between;column-gap:6px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--head-line)}
  :root[data-theme="light"] .sitenav{border-top-color:rgba(246,239,225,.25)}
  .sitenav>li{position:static}
  .sitenav-btn{padding:4px 0 1px;font-size:12px;letter-spacing:.05em;white-space:nowrap}
  .sitenav>li:nth-child(n) .sitenav-drop{top:100%;left:0;right:0;min-width:0}
}
@media(max-width:420px){
  .sitenav-btn{font-size:10px;letter-spacing:.02em}
}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:36px;letter-spacing:.05em;text-transform:uppercase;color:var(--head-text);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.tools{display:flex;gap:12px}
.btn{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;border:2px solid var(--head-text);color:var(--head-text);background:transparent;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s,color .15s}
:root[data-theme="dark"] .btn{border-color:var(--key)}
@media(hover:hover){
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-fg);box-shadow:none}
:root[data-theme="dark"] .btn:hover{border-color:var(--accent)}
}
.btn:active{box-shadow:none}
.btn:focus-visible{outline-color:var(--head-text)}
.icon-btn{width:44px;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
.stripes{height:7px;background:linear-gradient(var(--s1) 0 3px,var(--s2) 3px 5px,var(--s3) 5px 7px)}

main{flex:1;padding:40px var(--margin) 0}
.sheet{border:2px solid var(--frame);background:var(--card);box-shadow:none}
.masthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;min-height:76px;padding:12px 28px;background:var(--b-sports);color:var(--f-sports);border-bottom:2px solid var(--head-line)}
.masthead h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:48px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap}
.chips button{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:44px;padding:8px 18px;border:1.5px solid var(--f-sports);background:transparent;color:var(--f-sports);cursor:pointer;font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
.chips button+button{margin-left:-1.5px}
.chips button[aria-selected="true"],.chips button[aria-pressed="true"]{background:var(--accent);color:var(--sel-fg);position:relative}
.chips button:focus-visible{outline:3px solid var(--f-sports);outline-offset:3px;position:relative}
@media(hover:hover){.chips button[aria-selected="false"]:hover,.chips button[aria-pressed="false"]:hover{background:rgba(246,239,225,.14)}}
.chips.on-card button{border-color:var(--key);color:var(--text)}
.chips.on-card button[aria-pressed="true"]{border-color:var(--key);color:var(--sel-fg)}
.chips.on-card button:focus-visible{outline-color:var(--focus)}
@media(hover:hover){.chips.on-card button[aria-pressed="false"]:hover{background:var(--row-a)}}

.body{display:grid;grid-template-columns:minmax(360px,4fr) minmax(0,7fr);gap:2px;background:var(--head-line)}
.panel{background:var(--card);min-width:0;padding:24px 28px 28px}
.rail-inner{display:flex;flex-direction:column;gap:20px}
@media(min-width:961px) and (min-height:840px){.rail-inner{position:sticky;top:95px}}
.stage{display:flex;flex-direction:column;gap:20px;transition:opacity .2s}
.stage.loading{opacity:.45}

.section-label{font-family:var(--label);font-weight:600;font-size:14px;line-height:20px;color:var(--muted)}
.sign{border:1px solid var(--frame);background:var(--well-bg);box-shadow:none;min-width:0}
.sign-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--head-bg);color:var(--head-text);border-bottom:2px solid var(--head-line);padding:8px 16px;font-family:var(--display);font-weight:700;font-size:22px;line-height:28px;letter-spacing:.06em;text-transform:uppercase}
.sign-head .hv{font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sign-body{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 12px 18px}
.num{display:flex;align-items:center;justify-content:center;text-align:center;min-height:clamp(72px,8vw,96px);font-family:var(--display);font-weight:700;font-size:clamp(72px,8vw,96px);line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--text)}
.num.sm{min-height:56px;font-size:48px}
.num.strike{animation:strike .34s var(--ease)}
@keyframes strike{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}
.sky{display:flex;align-items:center;gap:10px;font-family:var(--label);font-weight:600;font-size:14px;line-height:20px;color:var(--muted)}
.glyph{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sky .glyph{color:var(--text)}
.sign-ref{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;margin-top:12px;min-height:28px;font-family:var(--label);font-weight:600;font-size:14px;line-height:20px}
.pill{font-weight:600;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums;color:var(--muted)}
:root:not([data-theme="dark"]) .pill{color:var(--muted)}

.ledger{width:100%;border-collapse:collapse;font-family:var(--label);font-size:16px;line-height:22px;letter-spacing:.02em}
.ledger th,.ledger td{padding:9px 14px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ledger thead th{background:var(--head-bg);color:var(--head-text);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger tbody tr+tr{border-top:1px solid var(--divider)}
.ledger tbody tr:nth-child(odd){background:var(--row-a)}
.ledger tbody tr:nth-child(even){background:var(--row-b)}
.ledger tbody th{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;white-space:nowrap}
.ledger td.note{text-align:left;font-size:14px;color:var(--muted);white-space:nowrap}
.ledger .unit{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.ledger.now{border-top:2px solid var(--head-line)}
.wind-note{display:flex;align-items:center;gap:8px}
.compass{width:34px;height:34px;flex:none}
.compass .ring{fill:var(--well-bg);stroke:var(--key);stroke-width:2}
.compass .tick{stroke:var(--key);stroke-width:2}
.compass .needle{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.compass .pip{fill:var(--accent)}
.ledger.week td.day{font-weight:600;font-size:14px}
.ledger.week td.day small{display:block;font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.ledger.week .cond{display:flex;align-items:center;gap:10px;text-align:left;font-size:14px}
.ledger.week .cond .glyph{width:26px;height:26px;color:var(--text)}
.ledger.week td.rng{width:34%;padding-left:6px;padding-right:6px}
.track{position:relative;height:14px;background:var(--well-bg);border:1.5px solid var(--key)}
.track i{position:absolute;top:-1.5px;bottom:-1.5px;background:var(--ser-temp)}
.ledger.week td.hi{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.02em}
.ledger.week td.lo{color:var(--muted)}
.ledger-wrap{border:1px solid var(--key)}

.plot{min-width:0;padding:8px 12px 6px}
.plot svg{display:block;width:100%;height:auto}
.plot .g{stroke:var(--divider);stroke-width:1}
.plot .ax{stroke:var(--key);stroke-width:2}
.plot .t{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.04em;fill:var(--muted);font-variant-numeric:tabular-nums}
.plot .ln{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.plot .ar{fill:var(--c);fill-opacity:.16;stroke:none}
.plot .av{fill:none;stroke:var(--text);stroke-width:1.5;stroke-linejoin:round;opacity:.75}
.plot .nm{fill:none;stroke:var(--c);stroke-width:1.5;stroke-dasharray:5 4;stroke-linejoin:round}
.plot .dot{fill:var(--c);stroke:var(--well-bg);stroke-width:2}
.plot .cross{stroke:var(--text);stroke-width:1;opacity:0}
.plot .cdot{fill:var(--well-bg);stroke:var(--text);stroke-width:2;opacity:0}
.plot svg.on .cross,.plot svg.on .cdot{opacity:1}
.plot.hov svg{cursor:crosshair;touch-action:pan-y}
.empty{padding:48px 20px;text-align:center;font-family:var(--label);font-weight:600;font-size:14px;color:var(--muted)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--head-line)}
.stat-row.two{grid-template-columns:repeat(2,1fr)}
.stat{padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--divider)}
.stat .k{font-family:var(--label);font-weight:600;font-size:14px;line-height:20px;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:36px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--muted);margin-left:4px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--head-line);border:2px solid var(--head-line)}
.tile{display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;border:0;background:var(--well-bg);padding:12px 14px 10px;cursor:pointer;transition:background .15s}
.tile .k{font-family:var(--label);font-weight:600;font-size:14px;line-height:20px;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:34px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-left:3px}
.tile .mini{display:block;width:100%;height:34px;margin-top:6px}
.mini .ar{fill:var(--c);fill-opacity:.16;stroke:none}
.mini .ln{fill:none;stroke:var(--c);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.tile:focus-visible{outline-offset:-3px}
@media(hover:hover){.tile[aria-pressed="false"]:hover{background:var(--row-b)}}

.tiles.odd .tile:last-child{grid-column:span 2}
.bar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.state{padding:56px 24px;text-align:center;font-family:var(--label);font-weight:600;font-size:14px;line-height:20px;color:var(--muted)}
.error-text{display:block;background:var(--live-bg);color:var(--live-fg);padding:10px 16px;font-family:var(--label);font-weight:600;font-size:14px;line-height:20px}

footer{margin-top:56px;background:var(--foot-bg);color:var(--foot-text);border-top:3px solid var(--foot-line)}
.sources{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:28px var(--margin) 48px}
.sources a{display:inline-flex;align-items:center;min-height:32px;font-family:var(--label);font-weight:600;font-size:14px;color:inherit;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);transition:text-decoration-color .15s}
.sources a:focus-visible{outline-color:var(--foot-text)}
@media(hover:hover){.sources a:hover{text-decoration-color:currentColor}}

@media(max-width:1100px){
  .panel{padding:20px 20px 24px}
  .ledger.now th,.ledger.now td{padding:9px 10px}
  .ledger.now td.note{font-size:12px;letter-spacing:.04em}
  .ledger.now .wind-note{gap:6px}
}
@media(max-width:960px){
  .body{grid-template-columns:1fr}
}
@media(max-width:700px){
  :root{--margin:16px}
  header{height:56px}
  .brand{font-size:24px;line-height:32px}
  .btn{padding:8px 14px}
  main{padding-top:24px}
  .masthead{padding:12px 16px}
  .masthead h1{font-size:28px;line-height:36px}
  .chips button{padding:8px 12px;flex:1}
  .masthead .chips{width:100%}
  .panel{padding:20px 16px 24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sign-head{font-size:18px;padding:6px 12px}
  .stat{padding:10px 10px}
  .stat .v{font-size:24px;line-height:30px}
  .ledger th,.ledger td{padding:8px 8px}
  .ledger.week td.rng{display:none}
  .ledger.week .rng-h{display:none}
  .ledger.week th,.ledger.week td{padding:8px 5px}
  .ledger.week .cond-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ledger.week td.hi{font-size:20px}
  body{margin:6px;min-height:calc(100vh - 12px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.num.strike{animation:none}}
/* Sections as ruled headings, tiles on 1px rules */
.sign{background:none;border:0}
.sign-head{background:none;color:var(--text);border:0;border-bottom:1px solid var(--key);padding:0 0 8px}
.sign-head .hv{color:var(--muted)}
.tiles{gap:1px;background:var(--key);border:0;border-top:1px solid var(--key);border-bottom:1px solid var(--key)}
.tile{background:var(--card)}
.ledger.now{border-top:0}
    </style>

<body>

    <div class="top">
        <header>

                    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

    <main>
        <div class="sheet">
            <div class="masthead">
                <h1>Tempest Station</h1>
                <div class="chips" role="tablist" aria-label="View" id="tabs">
                    <button type="button" role="tab" id="tab-24h" data-tab="24h" aria-controls="stage" aria-selected="true">24 Hours</button><button type="button" role="tab" id="tab-7d" data-tab="7d" aria-controls="stage" aria-selected="false" tabindex="-1">7-Day</button><button type="button" role="tab" id="tab-history" data-tab="history" aria-controls="stage" aria-selected="false" tabindex="-1">History</button>

    <footer>
        <div class="stripes"></div>
        <div class="sources"><a href="/trust/">Trust &amp; Sources</a><a href="https://weatherflow.com/" target="_blank" rel="noopener">WeatherFlow Tempest</a></div>
    </footer>

    <script>
        // Personal use token — visible client-side by design
        const TOKEN      = '4ce85bb1-b95b-4fa8-aaf8-c92b53e34c1a';
        const STATION_ID = 168029;
        const DEVICE_ID  = 400121;
        const BASE       = 'https://swd.weatherflow.com/swd/rest';
        const FIRST_YEAR = 2025;

        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        const n = (v, d = 0) => (v == null || isNaN(v)) ? '—' : (+v).toFixed(d);

        // ── Unit converters (metric → imperial) ──────────────────
        const c2f     = c  => +(c * 9/5 + 32).toFixed(1);
        const ms2mph  = ms => +(ms * 2.23694).toFixed(1);
        const mb2inhg = mb => +(mb * 0.0295301).toFixed(2);
        const mm2in   = mm => +(mm * 0.0393701).toFixed(3);

        function deg2card(deg) {
            const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
            return dirs[Math.round((deg || 0) / 22.5) % 16];
        }
        function uvLevel(uv) {
            if (uv == null) return '';
            if (uv < 3)  return 'Low';
            if (uv < 6)  return 'Moderate';
            if (uv < 8)  return 'High';
            if (uv < 11) return 'Very high';
            return 'Extreme';
        }

        // ── Weather glyphs ───────────────────────────────────────
        const CLOUD = 'M7 15h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 6.6 4.2 4.2 0 0 0 7 15z';
        const GLYPHS = {
            sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
            moon:  '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
            cloud: '<path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/>',
            partlyDay:   '<circle cx="8" cy="8" r="2.6"/><path d="M8 2.5v1.2M2.5 8h1.2M3.9 3.9l.9.9M12.1 3.9l-.9.9"/><path d="M9 20h8.5a3.5 3.5 0 0 0 .4-6.97A5 5 0 0 0 8.4 13 3.6 3.6 0 0 0 9 20z"/>',
            partlyNight: '<path d="M10.5 3a4.2 4.2 0 1 0 4.6 5.6A4.2 4.2 0 0 1 10.5 3z"/><path d="M9 20h8.5a3.5 3.5 0 0 0 .4-6.97A5 5 0 0 0 8.4 13 3.6 3.6 0 0 0 9 20z"/>',
            rain:  `<path d="${CLOUD}"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>`,
            snow:  `<path d="${CLOUD}"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 22h.01M14 22h.01" stroke-width="3"/>`,
            bolt:  `<path d="${CLOUD}"/><path d="M12.5 12l-2.5 4h4l-2.5 4"/>`,
            fog:   '<path d="M4 7h16M3 11h18M6 15h12M9 19h6"/>',
            wind:  '<path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>'
        };
        function glyph(icon) {
            const s = String(icon || '');
            const k = s.includes('thunder') ? 'bolt'
                : (s.includes('snow') || s.includes('sleet')) ? 'snow'
                : s.includes('rain') ? 'rain'
                : s.includes('fog') ? 'fog'
                : s === 'windy' ? 'wind'
                : s === 'partly-cloudy-night' ? 'partlyNight'
                : s.startsWith('partly') ? 'partlyDay'
                : s === 'clear-night' ? 'moon'
                : s.startsWith('clear') ? 'sun'
                : 'cloud';
            return `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">${GLYPHS[k]}</svg>`;
        }

        // ── Chart engine ─────────────────────────────────────────
        const decimals = s => { const t = String(+s.toFixed(6)); const i = t.indexOf('.'); return i < 0 ? 0 : t.length - i - 1; };

        function niceScale(lo, hi, forceMin, forceMax) {
            let min = forceMin ?? lo, max = forceMax ?? hi;
            if (max - min < 1e-9) max = min + 1;
            const raw = (max - min) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
            const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
            const a = forceMin ?? Math.floor(min / step) * step;
            const b = forceMax ?? Math.ceil(max / step) * step;
            const ticks = [];
            for (let v = a; v <= b + step / 1000; v += step) ticks.push(+v.toFixed(6));
            return { min: a, max: b, step, ticks };
        }

        function chart(o) {
            const { w, h, pts, color, tickUnit = '', dec = 0, min: fMin, max: fMax, xTicks = [], xMin, xMax, band = false, marks = false } = o;
            if (!pts || pts.length < 2) return { html: '<div class="empty">No data</div>' };
            const norm = band && pts.some(p => p.nhi != null);
            const ys = band ? pts.flatMap(p => norm && p.nhi != null ? [p.lo, p.hi, p.nlo, p.nhi] : [p.lo, p.hi]) : pts.map(p => p.y);
            const sc = niceScale(Math.min(...ys), Math.max(...ys), fMin, fMax);
            const dp = Math.max(dec, decimals(sc.step));
            const labels = sc.ticks.map(v => v.toFixed(dp) + tickUnit);
            const pad = { t: 16, r: 16, b: 28, l: Math.ceil(Math.max(...labels.map(l => l.length)) * 6.8) + 14 };
            const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
            const x0 = xMin ?? pts[0].x, x1 = xMax ?? pts[pts.length - 1].x;
            const sx = x => pad.l + (x - x0) / ((x1 - x0) || 1) * cw;
            const sy = v => pad.t + ch - (v - sc.min) / ((sc.max - sc.min) || 1) * ch;
            const f = v => v.toFixed(1);
            const base = pad.t + ch;
            const yLine = p => band ? p.avg : p.y;
            const line = 'M' + pts.map(p => `${f(sx(p.x))},${f(sy(yLine(p)))}`).join('L');
            const area = band
                ? 'M' + pts.map(p => `${f(sx(p.x))},${f(sy(p.hi))}`).join('L') + 'L' + pts.slice().reverse().map(p => `${f(sx(p.x))},${f(sy(p.lo))}`).join('L') + 'Z'
                : `M${f(sx(pts[0].x))},${f(base)}L` + pts.map(p => `${f(sx(p.x))},${f(sy(p.y))}`).join('L') + `L${f(sx(pts[pts.length - 1].x))},${f(base)}Z`;
            const nm = !norm ? '' : ['nhi', 'nlo'].map(k => {
                const q = pts.filter(p => p[k] != null);
                return q.length < 2 ? '' : `<path class="nm" d="M${q.map(p => `${f(sx(p.x))},${f(sy(p[k]))}`).join('L')}"/>`;
            }).join('');
            let mk = '';
            if (marks) {
                const yHi = p => band ? p.hi : p.y, yLo = p => band ? p.lo : p.y;
                let hi = pts[0], lo = pts[0];
                for (const p of pts) { if (yHi(p) > yHi(hi)) hi = p; if (yLo(p) < yLo(lo)) lo = p; }
                const last = pts[pts.length - 1];
                mk = [[hi, yHi(hi)], [lo, yLo(lo)], [last, yLine(last)]].map(([p, v]) => `<circle class="dot" cx="${f(sx(p.x))}" cy="${f(sy(v))}" r="5"/>`).join('');
            }
            const html = `<svg viewBox="0 0 ${w} ${h}" style="--c:var(${color})" role="img" aria-label="${esc(o.label || 'Chart')}">
                ${sc.ticks.map((v, i) => `<line class="g" x1="${pad.l}" x2="${pad.l + cw}" y1="${f(sy(v))}" y2="${f(sy(v))}"/><text class="t" x="${pad.l - 8}" y="${f(sy(v) + 4)}" text-anchor="end">${labels[i]}</text>`).join('')}
                <line class="ax" x1="${pad.l}" x2="${pad.l + cw}" y1="${base}" y2="${base}"/>
                <path class="ar" d="${area}"/>
                <path class="${band ? 'av' : 'ln'}" d="${line}"/>
                ${nm}
                ${xTicks.map(t => `<text class="t" x="${f(sx(t.x))}" y="${base + 19}" text-anchor="middle">${t.label}</text>`).join('')}
                ${mk}
                <line class="cross" y1="${pad.t}" y2="${base}" x1="0" x2="0"/><circle class="cdot" r="5" cx="0" cy="0"/>
            </svg>`;
            return { html, sx, sy, pad, cw, x0, x1, pts, w };
        }

        function miniChart(pts, floor0) {
            if (!pts || pts.length < 2) return '<svg class="mini" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path class="ln" d="M0,30L100,30"/></svg>';
            const step = Math.max(1, Math.floor(pts.length / 60));
            const p = pts.filter((_, i) => i % step === 0);
            const ys = p.map(d => d.y);
            let lo = floor0 ? 0 : Math.min(...ys), hi = Math.max(...ys);
            if (hi - lo < 1e-9) hi = lo + 1;
            const x0 = p[0].x, x1 = p[p.length - 1].x;
            const xy = d => `${((d.x - x0) / ((x1 - x0) || 1) * 100).toFixed(1)},${(30 - (d.y - lo) / (hi - lo) * 28).toFixed(1)}`;
            const line = 'M' + p.map(xy).join('L');
            return `<svg class="mini" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path class="ar" d="${line}L100,32L0,32Z"/><path class="ln" d="${line}"/></svg>`;
        }

        // The station is in Seattle; show its local time whatever the viewer's zone.
        const TZ = 'America/Los_Angeles';
        const TZ_PARTS = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });
        function tzOffset(t) {
            const p = Object.fromEntries(TZ_PARTS.formatToParts(new Date(t * 1000)).map(x => [x.type, +x.value]));
            return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) / 1000 - Math.floor(t);
        }
        const timeFmt = x => new Date(x * 1000).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true });
        function hourTicks(x0, x1, w) {
            const step = (w < 480 ? 6 : 4) * 3600, out = [], off = tzOffset(x0);
            for (let t = Math.ceil((x0 + off) / step) * step - off; t <= x1; t += step) {
                out.push({ x: t, label: new Date(t * 1000).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', hour12: true }) });
            }
            return out;
        }
        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        function monthTicks(data, w) {
            const out = [], yr = data[0].date.slice(0, 4);
            for (let m = 0; m < 12; m++) {
                const idx = data.findIndex(d => d.date >= `${yr}-${String(m + 1).padStart(2, '0')}-01`);
                if (idx >= 0) out.push({ x: idx, label: w < 480 ? MONTHS[m][0] : MONTHS[m] });
            }
            return out;
        }

        // Plots are drawn at their real pixel width so axis text stays at 1:1.
        const plots = {};
        function paintPlots() {
            document.querySelectorAll('.plot[data-plot]').forEach(el => {
                const fn = plots[el.dataset.plot];
                const w = Math.round(el.clientWidth - 24);
                if (!fn || w < 120) return;
                fn(el, w);
            });
        }

        // ── Live data (24 hours + now + forecast) ────────────────
        const F = {
            TS: 0, WIND_AVG: 2, WIND_GUST: 3, PRESSURE: 6, TEMP: 7, HUMIDITY: 8, UV: 10, SOLAR: 11, RAIN: 12
        };
        const METRICS = [
            { id: 'temp',  label: 'Temperature', short: 'Temp',     unit: '°F',   tick: '°',    dec: 0, color: '--ser-temp' },
            { id: 'hum',   label: 'Humidity',    short: 'Humidity', unit: '%',    tick: '%',    dec: 0, color: '--ser-hum',  min: 0 },
            { id: 'wind',  label: 'Wind Speed',  short: 'Wind',     unit: 'mph',  tick: '',     dec: 0, color: '--ser-wind', min: 0 },
            { id: 'gust',  label: 'Wind Gust',   short: 'Gust',     unit: 'mph',  tick: '',     dec: 0, color: '--ser-gust', min: 0 },
            { id: 'press', label: 'Pressure',    short: 'Pressure', unit: 'inHg', tick: '',     dec: 2, color: '--ser-press' },
            { id: 'uv',    label: 'UV Index',    short: 'UV',       unit: '',     tick: '',     dec: 1, color: '--ser-uv',   min: 0 },
            { id: 'solar', label: 'Solar',       short: 'Solar',    unit: 'W/m²', tick: '',     dec: 0, color: '--ser-solar', min: 0 },
            { id: 'rain',  label: 'Rain Today',  short: 'Rain',     unit: 'in',   tick: '',     dec: 2, color: '--ser-rain', min: 0 }
        ];
        const S = { tab: '24h', metric: 'temp', yearMetric: 'temp', hist: null, year: null, data: null, error: null, years: {} };
        let stageSeq = 0;

        async function loadAll() {
            try {
                const [obsRes, todayRes, yestRes, fcRes] = await Promise.all([
                    fetch(`${BASE}/observations/station/${STATION_ID}?token=${TOKEN}`),
                    fetch(`${BASE}/observations/device/${DEVICE_ID}?token=${TOKEN}&day_offset=0`),
                    fetch(`${BASE}/observations/device/${DEVICE_ID}?token=${TOKEN}&day_offset=1`),
                    fetch(`${BASE}/better_forecast?station_id=${STATION_ID}&token=${TOKEN}&units_temp=f&units_wind=mph&units_precip=in&units_pressure=inhg&units_distance=mi&units_direction=cardinal`)
                ]);
                if (!obsRes.ok || !fcRes.ok) throw new Error(`API error (${obsRes.status}/${fcRes.status})`);
                const [obsData, todayData, yestData, fcData] = await Promise.all([obsRes.json(), todayRes.json(), yestRes.json(), fcRes.json()]);

                const raw0 = obsData.obs?.[0];
                if (!raw0) throw new Error('No observations returned');
                // Station observations arrive in metric whatever the station's display units are.
                const cur = {
                    ...raw0,
                    wind_avg: ms2mph(raw0.wind_avg), wind_gust: ms2mph(raw0.wind_gust), wind_lull: ms2mph(raw0.wind_lull),
                    sea_level_pressure: mb2inhg(raw0.sea_level_pressure), dew_point: c2f(raw0.dew_point),
                    precip_accum_local_day: mm2in(raw0.precip_accum_local_day ?? 0),
                    precip_accum_local_yesterday: mm2in(raw0.precip_accum_local_yesterday ?? 0),
                    lightning_strike_last_distance: raw0.lightning_strike_last_distance != null ? Math.round(raw0.lightning_strike_last_distance * 0.621371) : null
                };
                const cc = fcData.current_conditions;
                if (!cc) throw new Error('No current_conditions in forecast');

                const nowEpoch = Date.now() / 1000, cutoff = nowEpoch - 24 * 3600;
                const rawObs = [...(yestData.obs || []), ...(todayData.obs || [])]
                    .filter(o => Array.isArray(o) && o[F.TS] >= cutoff && o[F.TS] <= nowEpoch)
                    .sort((a, b) => a[F.TS] - b[F.TS]);

                const ser = {
                    temp:  rawObs.map(o => ({ x: o[F.TS], y: c2f(o[F.TEMP]) })),
                    hum:   rawObs.map(o => ({ x: o[F.TS], y: o[F.HUMIDITY] })),
                    wind:  rawObs.map(o => ({ x: o[F.TS], y: ms2mph(o[F.WIND_AVG]) })),
                    gust:  rawObs.map(o => ({ x: o[F.TS], y: ms2mph(o[F.WIND_GUST]) })),
                    press: rawObs.map(o => ({ x: o[F.TS], y: mb2inhg(o[F.PRESSURE]) })),
                    uv:    rawObs.map(o => ({ x: o[F.TS], y: o[F.UV] ?? 0 })),
                    solar: rawObs.map(o => ({ x: o[F.TS], y: o[F.SOLAR] ?? 0 }))
                };
                const off = tzOffset(nowEpoch), midnight = Math.floor((nowEpoch + off) / 86400) * 86400 - off;
                let rs = 0;
                ser.rain = rawObs.filter(o => o[F.TS] >= midnight)
                    .map(o => { rs += mm2in(o[F.RAIN] ?? 0); return { x: o[F.TS], y: +rs.toFixed(3) }; });

                const rainToday = cur.precip_accum_local_day ?? rs;
                const battV = cur.battery;
                S.data = {
                    cur, cc, ser,
                    daily: fcData.forecast?.daily?.slice(0, 7) || [],
                    now: {
                        temp: cc.air_temperature, hum: cur.relative_humidity, wind: cur.wind_avg, gust: cur.wind_gust,
                        press: cur.sea_level_pressure, uv: cur.uv ?? 0, solar: cur.solar_radiation ?? 0, rain: rainToday
                    },
                    rainYest: cur.precip_accum_local_yesterday ?? 0,
                    battPct: battV != null ? Math.min(100, Math.max(0, Math.round((battV - 2.35) / (2.80 - 2.35) * 100))) : null,
                    updated: timeFmt(cur.timestamp)
                };
                S.error = null;
                $('rail').classList.remove('loading');
                renderRail();
                if (S.tab !== 'history') renderStage();
            } catch (err) {
                console.error(err);
                if (!S.data) {
                    S.error = err.message;
                    $('rail').innerHTML = `<div class="state">Couldn’t load station data</div><div class="error-text">${esc(err.message)}</div>`;
                    if (S.tab !== 'history') renderStage();
                }
            }
        }

        // ── Now rail ─────────────────────────────────────────────
        function compass(deg) {
            const rad = (deg - 90) * Math.PI / 180, r = 11;
            const tx = 17 + r * Math.cos(rad), ty = 17 + r * Math.sin(rad);
            return `<svg class="compass" viewBox="0 0 34 34" aria-hidden="true"><circle class="ring" cx="17" cy="17" r="15"/><path class="tick" d="M17 2v4"/><path class="needle" d="M17 17L${tx.toFixed(1)} ${ty.toFixed(1)}"/><circle class="pip" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="3"/></svg>`;
        }

        function renderRail() {
            const { cur, cc, daily, now, rainYest, battPct, updated } = S.data;
            const hi = daily[0]?.air_temp_high ?? cc.air_temperature, lo = daily[0]?.air_temp_low ?? cc.air_temperature;
            const lightning = cur.lightning_strike_count_last_3hr ?? 0;
            const row = (k, v, unit, note) => `<tr><th scope="row">${k}</th><td>${v}${unit ? `<span class="unit">${unit}</span>` : ''}</td><td class="note">${note || ''}</td></tr>`;
            $('rail').innerHTML = `
                <section class="sign" aria-labelledby="now-h">
                    <h2 class="sign-head"><span id="now-h">Now</span><span class="hv">${updated}</span></h2>
                    <div class="sign-body">
                        <output class="num strike">${Math.round(cc.air_temperature)}°</output>
                        <div class="sky">${glyph(cc.icon)}<span>${esc(cc.conditions)}</span></div>
                        <div class="sign-ref">
                            <span class="pill">Feels ${Math.round(cc.feels_like)}°</span>
                            <span class="pill">Hi ${Math.round(hi)}° Lo ${Math.round(lo)}°</span>
                            ${cc.precip_probability > 0 ? `<span class="pill">Rain ${cc.precip_probability}%</span>` : ''}
                        </div>
                    </div>
                    <table class="ledger now" aria-label="Current readings"><tbody>
                        ${row('Wind', n(cur.wind_avg, 1), 'mph', `<span class="wind-note">${compass(cur.wind_direction ?? 0)}${deg2card(cur.wind_direction)}</span>`)}
                        ${row('Gust', n(cur.wind_gust, 1), 'mph', `Lull ${n(cur.wind_lull, 1)}`)}
                        ${row('Humidity', n(cur.relative_humidity), '%', `Dew ${Math.round(cur.dew_point)}°`)}
                        ${row('Pressure', n(cur.sea_level_pressure, 2), 'inHg', esc(cur.pressure_trend || ''))}
                        ${row('UV', n(cur.uv ?? 0, 1), '', uvLevel(cur.uv))}
                        ${row('Solar', n(cur.solar_radiation ?? 0), 'W/m²', '')}
                        ${row('Rain today', n(now.rain, 2), 'in', `Yday ${n(rainYest, 2)}`)}
                        ${lightning > 0
                            ? row('Lightning', lightning, '', `3h${cur.lightning_strike_last_distance != null ? ` · ${cur.lightning_strike_last_distance} mi` : ''}`)
                            : row('Lightning', 'None', '', '')}
                        ${cur.battery != null ? row('Battery', n(cur.battery, 2), 'V', battPct != null ? battPct + '%' : '') : ''}
                    </tbody></table>
                </section>`;
        }

        // ── 24 Hours stage ───────────────────────────────────────
        const metricById = id => METRICS.find(m => m.id === id);
        const fmtVal = (m, v) => n(v, m.dec);

        function statsFor(m) {
            const d = S.data, pts = d.ser[m.id], unit = m.unit ? `<small>${m.unit}</small>` : '';
            if (m.id === 'rain') {
                return `<div class="stat-row two"><div class="stat"><span class="k">Today</span><span class="v">${n(d.now.rain, 2)}${unit}</span></div><div class="stat"><span class="k">Yesterday</span><span class="v">${n(d.rainYest, 2)}${unit}</span></div></div>`;
            }
            if (!pts.length) return '';
            let hi = pts[0], lo = pts[0];
            for (const p of pts) { if (p.y > hi.y) hi = p; if (p.y < lo.y) lo = p; }
            const cell = (k, v, extra, id) => `<div class="stat"${id ? ` id="${id}"` : ''}><span class="k">${k}</span><span class="v">${v}${unit}</span>${extra ? `<span class="k">${extra}</span>` : ''}</div>`;
            return `<div class="stat-row">${cell('Now', fmtVal(m, d.now[m.id]), '', 'stat-now')}${cell('High', fmtVal(m, hi.y), timeFmt(hi.x))}${cell('Low', fmtVal(m, lo.y), timeFmt(lo.x))}</div>`;
        }

        function renderBig() {
            const m = metricById(S.metric), pts = S.data.ser[m.id];
            const rainEmpty = m.id === 'rain' && !(S.data.now.rain > 0);
            $('big').innerHTML = `
                <h2 class="sign-head"><span>${m.label}</span><span class="hv">Last 24 hours</span></h2>
                ${statsFor(m)}
                ${rainEmpty ? '<div class="empty">No rain today</div>' : '<div class="plot hov" data-plot="big"></div>'}`;
            plots.big = (el, w) => {
                const x0 = S.data.ser.temp.length ? S.data.ser.temp[0].x : undefined;
                const x1 = S.data.ser.temp.length ? S.data.ser.temp[S.data.ser.temp.length - 1].x : undefined;
                const step = Math.max(1, Math.floor(pts.length / 400));
                const cp = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
                const r = chart({ w, h: w < 520 ? 220 : 256, pts: cp, color: m.color, tickUnit: m.tick, dec: m.dec, min: m.min,
                    xMin: m.id === 'rain' ? x0 : undefined, xMax: m.id === 'rain' ? x1 : undefined,
                    xTicks: hourTicks(m.id === 'rain' ? x0 : cp[0]?.x ?? 0, m.id === 'rain' ? x1 : cp[cp.length - 1]?.x ?? 0, w),
                    marks: m.id !== 'rain', label: `${m.label}, last 24 hours` });
                el.innerHTML = r.html;
                const unit = m.unit ? `<small>${m.unit}</small>` : '';
                crosshair(el, r, p => ({ k: timeFmt(p.x), v: fmtVal(m, p.y) + unit }));
            };
            paintPlots();
        }

        // Hovering a plot moves the crosshair and shows the point in the first stat cell.
        function crosshair(el, r, read) {
            if (!r.sx) return;
            const svg = el.querySelector('svg'), cross = svg.querySelector('.cross'), cdot = svg.querySelector('.cdot');
            const cell = $('stat-now');
            const nowK = cell?.querySelector('.k'), nowV = cell?.querySelector('.v');
            const k0 = nowK?.textContent, v0 = nowV?.innerHTML;
            const show = e => {
                const box = svg.getBoundingClientRect();
                const x = (e.clientX - box.left) * (r.w / box.width);
                let best = r.pts[0], bd = Infinity;
                for (const p of r.pts) { const dd = Math.abs(r.sx(p.x) - x); if (dd < bd) { bd = dd; best = p; } }
                const px = r.sx(best.x), py = r.sy(best.y ?? best.avg);
                cross.setAttribute('x1', px); cross.setAttribute('x2', px);
                cdot.setAttribute('cx', px); cdot.setAttribute('cy', py);
                svg.classList.add('on');
                if (nowK) { const o = read(best); nowK.textContent = o.k; nowV.innerHTML = o.v; }
            };
            const hide = () => { svg.classList.remove('on'); if (nowK) { nowK.textContent = k0; nowV.innerHTML = v0; } };
            svg.addEventListener('pointermove', show);
            svg.addEventListener('pointerdown', show);
            svg.addEventListener('pointerleave', hide);
        }

        function render24() {
            const st = $('stage');
            st.innerHTML = `
                <section class="sign" id="big" aria-live="polite"></section>
                <div class="tiles" role="group" aria-label="Metric">
                    ${METRICS.map(m => `
                        <button type="button" class="tile" data-m="${m.id}" aria-pressed="${m.id === S.metric}" style="--c:var(${m.color})">
                            <span class="k">${m.short}</span>
                            <span class="v">${fmtVal(m, S.data.now[m.id])}${m.unit ? `<small>${m.unit}</small>` : ''}</span>
                            ${miniChart(S.data.ser[m.id], m.min === 0)}
                        </button>`).join('')}
                </div>`;
            renderBig();
        }

        // ── 7-Day stage ──────────────────────────────────────────
        function renderForecast() {
            const daily = S.data.daily;
            if (!daily.length) { $('stage').innerHTML = '<div class="state">No forecast</div>'; return; }
            const lo = Math.min(...daily.map(d => d.air_temp_low)), hi = Math.max(...daily.map(d => d.air_temp_high)), span = (hi - lo) || 1;
            $('stage').innerHTML = `
                <div class="ledger-wrap"><table class="ledger week" aria-label="7-day forecast">
                    <thead><tr><th scope="col">Day</th><th scope="col">Sky</th><th scope="col" class="rng-h" style="text-align:center">Range</th><th scope="col">Low</th><th scope="col">High</th><th scope="col">Rain</th></tr></thead>
                    <tbody>${daily.map((d, i) => {
                        const dt = new Date(d.day_start_local * 1000);
                        const name = i === 0 ? 'Today' : dt.toLocaleDateString('en-US', { timeZone: TZ, weekday: 'short' });
                        const iso = dt.toLocaleDateString('en-CA', { timeZone: TZ });
                        const l = (d.air_temp_low - lo) / span * 100, w = Math.max(2, (d.air_temp_high - d.air_temp_low) / span * 100);
                        return `<tr>
                            <td class="day">${name}<small>${iso.slice(5)}</small></td>
                            <td><div class="cond">${glyph(d.icon)}<span class="cond-t">${esc(d.conditions || '')}</span></div></td>
                            <td class="rng"><div class="track" role="img" aria-label="Low ${Math.round(d.air_temp_low)}, high ${Math.round(d.air_temp_high)}"><i style="left:${l.toFixed(1)}%;width:${w.toFixed(1)}%"></i></div></td>
                            <td class="lo">${Math.round(d.air_temp_low)}°</td>
                            <td class="hi">${Math.round(d.air_temp_high)}°</td>
                            <td>${d.precip_probability > 0 ? d.precip_probability + '%' : '—'}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table></div>`;
        }

        // ── History stage ────────────────────────────────────────
        const DF = {
            DATE: 0, PRES_AVG: 1, TEMP_AVG: 4, TEMP_MAX: 5, TEMP_MIN: 6,
            HUM_AVG: 7, HUM_MAX: 8, HUM_MIN: 9, SOLAR_MAX: 17,
            WIND_AVG: 13, WIND_GUST: 14, RAIN: 29
        };
        async function loadAnnual(year) {
            if (S.years[year]) return S.years[year];
            const start = Date.UTC(year, 0, 1) / 1000, end = Date.UTC(year + 1, 0, 1) / 1000;
            const res = await fetch(`${BASE}/observations/device/${DEVICE_ID}?token=${TOKEN}&time_start=${start}&time_end=${end}`);
            if (!res.ok) throw new Error(`API error (${res.status})`);
            const data = await res.json();
            const obs = (data.obs || []).filter(o => o[DF.DATE] && String(o[DF.DATE]).startsWith(String(year)));
            S.years[year] = obs;
            return obs;
        }

        function yearChips() {
            const ys = [];
            for (let y = new Date().getFullYear(); y >= FIRST_YEAR; y--) ys.push(y);
            return `<div class="bar-head"><div class="section-label" id="year-label">Year</div><div class="chips on-card" role="group" aria-labelledby="year-label">${ys.map(y => `<button type="button" data-year="${y}" aria-pressed="${y === S.year}">${y}</button>`).join('')}</div></div>`;
        }

        const YEAR_METRICS = [
            { id: 'temp',  label: 'Temperature', short: 'Temp',     sub: 'Daily high / low', unit: '°F',   tick: '°', dec: 0, color: '--ser-temp', band: true },
            { id: 'hum',   label: 'Humidity',    short: 'Humidity', sub: 'Daily range',      unit: '%',    tick: '%', dec: 0, color: '--ser-hum',  band: true, min: 0 },
            { id: 'rain',  label: 'Rain',        short: 'Rain',     sub: 'Cumulative',       unit: 'in',   tick: '',  dec: 2, color: '--ser-rain', min: 0 },
            { id: 'wind',  label: 'Wind Speed',  short: 'Wind',     sub: 'Daily avg',        unit: 'mph',  tick: '',  dec: 1, color: '--ser-wind', min: 0 },
            { id: 'gust',  label: 'Wind Gust',   short: 'Gust',     sub: 'Daily max',        unit: 'mph',  tick: '',  dec: 0, color: '--ser-gust', min: 0 },
            { id: 'press', label: 'Pressure',    short: 'Pressure', sub: 'Daily avg',        unit: 'inHg', tick: '',  dec: 2, color: '--ser-press' },
            { id: 'solar', label: 'Solar',       short: 'Solar',    sub: 'Daily peak',       unit: 'W/m²', tick: '',  dec: 0, color: '--ser-solar', min: 0 }
        ];
        const yearMetricById = id => YEAR_METRICS.find(m => m.id === id);
        const dayFmt = d => `${MONTHS[+d.slice(5, 7) - 1]} ${+d.slice(8, 10)}`;
        const mean = a => a.reduce((s, v) => s + v, 0) / a.length;

        function tempDay(o) {
            const hi = c2f(o[DF.TEMP_MAX]), lo = c2f(o[DF.TEMP_MIN]), avg = c2f(o[DF.TEMP_AVG]);
            return { hi, lo: (avg - lo > 40) ? avg : lo, avg };
        }
        // Day of a non-leap year (Feb 29 folds into Feb 28) from an ISO date.
        const doy = d => { const m = +d.slice(5, 7), dd = Math.min(+d.slice(8, 10), m === 2 ? 28 : 31); return Math.round((Date.UTC(2025, m - 1, dd) - Date.UTC(2025, 0, 1)) / 864e5); };
        // Normal high/low per calendar day from every station year, smoothed over a wrapping 31-day window.
        function normals(allObs) {
            const sum = Array.from({ length: 365 }, () => ({ hi: 0, lo: 0, n: 0 }));
            for (const o of allObs) {
                if (o[DF.TEMP_MAX] == null || o[DF.TEMP_MIN] == null) continue;
                const t = tempDay(o), b = sum[doy(String(o[DF.DATE]))];
                b.hi += t.hi; b.lo += t.lo; b.n++;
            }
            return sum.map((_, i) => {
                let hi = 0, lo = 0, n = 0;
                for (let k = -15; k <= 15; k++) { const b = sum[(i + k + 365) % 365]; hi += b.hi; lo += b.lo; n += b.n; }
                return n ? { hi: hi / n, lo: lo / n } : null;
            });
        }

        function renderHistoryBody(obs, year, norm) {
            if (!obs || obs.length < 7) { S.hist = null; return '<div class="state">Not enough data yet</div>'; }
            const band = (hi, lo, avg) => obs.map((o, i) => ({ x: i, date: o[DF.DATE], hi: hi(o), lo: lo(o), avg: avg(o) }));
            const single = f => obs.map((o, i) => ({ x: i, date: o[DF.DATE], y: f(o) }));
            let acc = 0;
            const ser = {
                temp: obs.map((o, i) => {
                    const nd = norm?.[doy(String(o[DF.DATE]))];
                    return { x: i, date: o[DF.DATE], ...tempDay(o), nhi: nd?.hi, nlo: nd?.lo };
                }),
                hum:   band(o => o[DF.HUM_MAX], o => o[DF.HUM_MIN], o => o[DF.HUM_AVG]),
                rain:  obs.map((o, i) => { const day = mm2in(o[DF.RAIN] ?? 0); acc += day; return { x: i, date: o[DF.DATE], y: +acc.toFixed(2), day }; }),
                wind:  single(o => ms2mph(o[DF.WIND_AVG])),
                gust:  single(o => ms2mph(o[DF.WIND_GUST])),
                press: single(o => mb2inhg(o[DF.PRES_AVG])),
                solar: single(o => { const v = o[DF.SOLAR_MAX] ?? 0; return v > 1500 ? 0 : v; })
            };
            S.hist = { year, ser };
            return `
                <section class="sign" id="big" aria-live="polite"></section>
                <div class="tiles odd" role="group" aria-label="Metric">
                    ${YEAR_METRICS.map(m => `
                        <button type="button" class="tile" data-m="${m.id}" aria-pressed="${m.id === S.yearMetric}" style="--c:var(${m.color})">
                            <span class="k">${m.short}</span>
                            <span class="v">${n(yearSummary(m, ser[m.id]), m.dec)}${m.unit ? `<small>${m.unit}</small>` : ''}</span>
                            ${miniChart(ser[m.id].map(p => ({ x: p.x, y: p.y ?? p.avg })), m.min === 0)}
                        </button>`).join('')}
                </div>`;
        }

        // Tile value: the year total for rain, the peak for gust and solar, the mean otherwise.
        function yearSummary(m, pts) {
            if (m.id === 'rain') return pts[pts.length - 1].y;
            if (m.id === 'gust' || m.id === 'solar') return Math.max(...pts.map(p => p.y));
            return mean(pts.map(p => p.y ?? p.avg));
        }

        function yearStats(m, pts) {
            const unit = m.unit ? `<small>${m.unit}</small>` : '';
            const cell = (k, v, extra, id) => `<div class="stat"${id ? ` id="${id}"` : ''}><span class="k">${k}</span><span class="v">${n(v, m.dec)}${unit}</span>${extra ? `<span class="k">${extra}</span>` : ''}</div>`;
            if (m.id === 'rain') {
                let wet = pts[0];
                for (const p of pts) if (p.day > wet.day) wet = p;
                const days = pts.filter(p => p.day >= 0.01).length;
                return `<div class="stat-row">${cell('Total', pts[pts.length - 1].y, '', 'stat-now')}${cell('Wettest', wet.day, dayFmt(wet.date))}<div class="stat"><span class="k">Rain days</span><span class="v">${days}</span></div></div>`;
            }
            const yHi = p => m.band ? p.hi : p.y, yLo = p => m.band ? p.lo : p.y;
            let hi = pts[0], lo = pts[0];
            for (const p of pts) { if (yHi(p) > yHi(hi)) hi = p; if (yLo(p) < yLo(lo)) lo = p; }
            return `<div class="stat-row">${cell('Average', mean(pts.map(p => p.y ?? p.avg)), '', 'stat-now')}${cell('High', yHi(hi), dayFmt(hi.date))}${cell('Low', yLo(lo), dayFmt(lo.date))}</div>`;
        }

        function renderYearBig() {
            const m = yearMetricById(S.yearMetric), { year, ser } = S.hist, pts = ser[m.id];
            const unit = m.unit ? `<small>${m.unit}</small>` : '';
            $('big').innerHTML = `
                <h2 class="sign-head"><span>${m.label}</span><span class="hv">${m.sub}</span></h2>
                ${yearStats(m, pts)}
                <div class="plot hov" data-plot="big"></div>`;
            plots.big = (el, w) => {
                const r = chart({ w, h: w < 520 ? 220 : 256, pts, band: m.band, color: m.color, tickUnit: m.tick, dec: m.dec, min: m.min,
                    xTicks: monthTicks(pts, w), marks: m.id !== 'rain', label: `${m.label}, ${m.sub.toLowerCase()} ${year}` });
                el.innerHTML = r.html;
                crosshair(el, r, p => ({
                    k: dayFmt(p.date) + (p.nhi != null ? ` · Normal ${n(p.nhi, m.dec)} / ${n(p.nlo, m.dec)}` : ''),
                    v: (m.band ? `${n(p.hi, m.dec)} / ${n(p.lo, m.dec)}` : n(m.id === 'rain' ? p.day : p.y, m.dec)) + unit
                }));
            };
            paintPlots();
        }

        async function renderHistory() {
            const seq = ++stageSeq, st = $('stage');
            st.setAttribute('aria-labelledby', 'tab-history');
            const head = yearChips();
            st.innerHTML = head + '<div class="state">Loading</div>';
            try {
                const ys = [];
                for (let y = new Date().getFullYear(); y >= FIRST_YEAR; y--) ys.push(y);
                const [obs, all] = await Promise.all([loadAnnual(S.year), Promise.allSettled(ys.map(loadAnnual))]);
                if (seq !== stageSeq) return;
                const allObs = all.flatMap(a => a.status === 'fulfilled' ? a.value : []);
                st.innerHTML = head + renderHistoryBody(obs, S.year, normals(allObs));
                if (S.hist) renderYearBig();
            } catch (err) {
                console.error(err);
                if (seq !== stageSeq) return;
                st.innerHTML = head + `<div class="state">Couldn’t load year data</div><div class="error-text">${esc(err.message)}</div>`;
            }
        }

        // ── Stage + routing ──────────────────────────────────────
        function renderStage() {
            const st = $('stage');
            stageSeq++;
            st.setAttribute('aria-labelledby', 'tab-' + S.tab);
            if (S.tab === 'history') { renderHistory(); return; }
            if (!S.data) { st.innerHTML = S.error ? `<div class="state">Couldn’t load station data</div>` : '<div class="state">Loading</div>'; return; }
            if (S.tab === '7d') renderForecast(); else render24();
        }

        function paintTabs() {
            document.querySelectorAll('#tabs [role=tab]').forEach(b => {
                const on = b.dataset.tab === S.tab;
                b.setAttribute('aria-selected', on);
                b.tabIndex = on ? 0 : -1;
            });
        }

        function parseHash() {
            const h = location.hash;
            const m = h.match(/^#year(?:\/(\d{4}))?$/);
            if (m) return { tab: 'history', year: +m[1] || new Date().getFullYear() };
            if (h === '#forecast') return { tab: '7d' };
            return { tab: '24h' };
        }
        function route() {
            const r = parseHash();
            S.tab = r.tab;
            if (r.year) S.year = r.year;
            paintTabs();
            renderStage();
        }
        const hashFor = (tab, year) => tab === 'history' ? `#year/${year || S.year}` : tab === '7d' ? '#forecast' : '#';
        function go(hash) {
            if (location.hash === hash || (hash === '#' && location.hash === '')) route();
            else location.hash = hash;
        }

        $('tabs').addEventListener('click', e => {
            const b = e.target.closest('[role=tab]');
            if (b) go(hashFor(b.dataset.tab));
        });
        $('tabs').addEventListener('keydown', e => {
            const tabs = [...document.querySelectorAll('#tabs [role=tab]')];
            const i = tabs.indexOf(document.activeElement);
            if (i < 0) return;
            let j = -1;
            if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
            else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
            else if (e.key === 'Home') j = 0;
            else if (e.key === 'End') j = tabs.length - 1;
            if (j < 0) return;
            e.preventDefault();
            tabs[j].focus();
            go(hashFor(tabs[j].dataset.tab));
            tabs[j].focus();
        });

        $('stage').addEventListener('click', e => {
            const tile = e.target.closest('.tile');
            if (tile) {
                const hist = S.tab === 'history';
                if (hist) S.yearMetric = tile.dataset.m; else S.metric = tile.dataset.m;
                document.querySelectorAll('.tile').forEach(t => t.setAttribute('aria-pressed', t === tile));
                if (hist) renderYearBig(); else renderBig();
                return;
            }
            const yr = e.target.closest('[data-year]');
            if (yr) go(`#year/${yr.dataset.year}`);
        });

        window.addEventListener('hashchange', route);
        let lastW = 0, raf = 0;
        new ResizeObserver(entries => {
            const w = Math.round(entries[0].contentRect.width);
            if (w === lastW) return;
            lastW = w;
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(paintPlots);
        }).observe($('stage'));

        // ── Theme ────────────────────────────────────────────────
        const root = document.documentElement, mode = $('mode');
        const paintMode = () => mode.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        mode.addEventListener('click', () => {
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
            paintMode();
        });
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            let saved = null;
            try { saved = localStorage.getItem('theme'); } catch (x) {}
            if (saved === 'light' || saved === 'dark') return;
            root.dataset.theme = e.matches ? 'dark' : 'light';
            paintMode();
        });
        paintMode();

        // ── Go ───────────────────────────────────────────────────
        S.year = new Date().getFullYear();
        route();
        loadAll();
        setInterval(loadAll, 5 * 60 * 1000);
    </script>
<script>
(function () {
  var nav = document.querySelector('.sitenav');
  if (!nav) return;
  function close(except) {
    nav.querySelectorAll(':scope>li').forEach(function (li) {
      if (li === except) return;
      li.dataset.open = 'false';
      li.firstElementChild.setAttribute('aria-expanded', 'false');
    });
  }
  nav.querySelectorAll('.sitenav-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var li = b.parentElement, open = li.dataset.open !== 'true';
      close(li);
      li.dataset.open = open;
      b.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target)) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
</body>
</html>
