<html lang="en" data-theme="light">
<head>

    <meta name="description" content="Seattle Seahawks, Mariners, Kraken and Sounders scores, schedules and standings.">
    <meta name="theme-color" content="#24422e">
    <meta property="og:type" content="website">

    <meta property="og:description" content="Seattle Seahawks, Mariners, Kraken and Sounders scores, schedules and standings.">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Vollkorn:ital,wght@0,400;1,400&family=Work+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Federal Park Serigraph (light) */
:root{
  color-scheme:light;
  --canvas:#f6efe1; --card:#ede3ce; --row-a:#f6efe1; --row-b:#ede3ce;
  --text:#181c16; --muted:#4d5843; --head-bg:#24422e; --head-text:#f6efe1; --head-line:#181c16;
  --key:#4d5843; --frame:#24422e; --divider:rgba(77,88,67,.25);
  --shadow:#181c16; --accent:#d9822b; --focus:#24422e; --sel-bg:#d9822b; --sel-fg:#181c16;
  --btn-hover-bg:#ede3ce; --btn-hover-fg:#24422e;
  --well-bg:#f6efe1; --well-shadow:rgba(24,28,22,.15);
  --live-bg:#a63a24; --live-fg:#f6efe1; --on-team:#f6efe1;
  --s1:#24422e; --s2:#d9822b; --s3:#a63a24;
  --foot-bg:#1c2730; --foot-text:#f6efe1; --foot-line:#181c16; --foot-accent:#d9822b;
  --b-sports:#24422e; --f-sports:#f6efe1;
  --display:'Oswald','Arial Narrow',sans-serif;
  --body:'Vollkorn',Georgia,serif;
  --label:'Work Sans',system-ui,sans-serif;
  --margin:max(40px,calc((100% - 1200px)/2));
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Nocturne Serigraph (dark) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e1511; --card:#1a271f; --row-a:#141e17; --row-b:#1a271f;
  --text:#f4ede2; --muted:#96a498; --head-bg:#141e17; --head-text:#f4ede2; --head-line:#35483b;
  --key:#35483b; --frame:#35483b; --divider:#233328;
  --shadow:#060a08; --accent:#e5933a; --focus:#e5933a; --sel-bg:#e5933a; --sel-fg:#0e1511;
  --btn-hover-bg:#1a271f; --btn-hover-fg:#f4ede2;
  --well-bg:#0a0f0c; --well-shadow:#060a08;
  --live-bg:#ff8168; --live-fg:#3e0400; --on-team:#f4ede2;
  --s1:#44805d; --s2:#e5933a; --s3:#c8523b;
  --foot-bg:#0a0f0c; --foot-text:#ded5c5; --foot-line:#35483b; --foot-accent:#e5933a;
  --b-sports:#2d4b38; --f-sports:#f4ede2;
}
html{scrollbar-gutter:stable}
body{background:var(--canvas);color:var(--text);font-family:var(--body);margin:10px;border:2px solid var(--key);min-height:calc(100vh - 20px);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.skip-link{position:absolute;top:-48px;left:16px;background:var(--head-text);color:var(--head-bg);padding:8px 16px;z-index:200;font-family:var(--label);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.skip-link:focus{top:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
header{background:var(--head-bg);border-bottom:3px solid var(--head-line);padding:0 var(--margin);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:36px;letter-spacing:.05em;text-transform:uppercase;color:var(--head-text);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.tools{display:flex;gap:12px}
.btn{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:8px 22px;border:2px solid var(--head-text);color:var(--head-text);background:transparent;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s,color .15s}
:root[data-theme="dark"] .btn{border-color:var(--key)}
@media(hover:hover){
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-fg);box-shadow:4px 4px 0 0 var(--shadow);transform:translate(-2px,-2px)}
:root[data-theme="dark"] .btn:hover{border-color:var(--accent)}
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--shadow)}
.btn:focus-visible{outline-color:var(--head-text)}
.icon-btn{width:44px;padding:0;justify-content:center}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}
.stripes{height:7px;background:linear-gradient(var(--s1) 0 3px,var(--s2) 3px 5px,var(--s3) 5px 7px)}

main{flex:1;padding:40px var(--margin) 0}
/* framed sheet: Sports band masthead over a flush 2x2 of team panels */
.sheet{border:3px solid var(--frame);background:var(--card);box-shadow:4px 4px 0 0 var(--shadow)}
.masthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;min-height:76px;padding:12px 28px;background:var(--b-sports);color:var(--f-sports);border-bottom:2px solid var(--head-line)}
.masthead h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:48px;letter-spacing:.04em;text-transform:uppercase}
.header-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-family:var(--label);font-weight:600;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase}
.masthead .btn{border-color:var(--f-sports);color:var(--f-sports)}
@media(hover:hover){:root[data-theme="dark"] .masthead .btn:hover{border-color:var(--accent);color:var(--btn-hover-fg)}.masthead .btn:hover{color:var(--btn-hover-fg)}}
.masthead .btn:focus-visible{outline-color:var(--f-sports)}

.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--head-line)}
.team-card{background:var(--card);min-width:0;container-type:inline-size}
.team-header{display:flex;align-items:center;gap:16px;min-height:72px;padding:10px 24px;background:var(--c);color:var(--on-team)}
.logo-tile{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:28px;height:28px}
.logo-tile img{width:100%;height:100%;object-fit:contain}
.team-header .logo-tile{width:52px;height:52px}
.team-info{flex:1;min-width:0}
.team-badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-left:auto}
.team-name{font-family:var(--display);font-weight:700;font-size:28px;line-height:36px;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.team-record{font-family:var(--label);font-weight:700;font-size:14px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.accent-bar{height:5px;background:var(--a);border-bottom:2px solid var(--head-line)}
.live-badge{display:flex;align-items:center;gap:8px;background:var(--live-bg);color:var(--live-fg);font-family:var(--label);font-weight:700;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:9999px}
.live-dot{flex:none;width:8px;height:8px;background:currentColor;border-radius:50%}
.season-badge{font-family:var(--label);font-weight:700;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border:1.5px solid currentColor;border-radius:9999px;white-space:nowrap}

.team-body{display:flex;gap:24px;padding:20px 24px 24px}
.card-games{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-standings{width:250px;flex-shrink:0;border-left:1px solid var(--key);padding-left:24px}
.section-label{font-family:var(--label);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.section-label.live-label{display:flex;align-items:center;gap:8px;color:var(--text)}

.game-box,.next-game-box{background:var(--well-bg);border:2px solid var(--key);box-shadow:inset 2px 2px 0 0 var(--well-shadow);padding:12px 14px}
.game-matchup{display:flex;flex-direction:column;gap:6px}
.game-team-row{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:22px;line-height:28px;letter-spacing:.02em;text-transform:uppercase}
.game-team-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-team-score{font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.game-team-row.loser{opacity:.7}
.game-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--divider);font-family:var(--label);font-weight:600;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase}
.result-w,.result-l{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:0}
.result-w{background:var(--accent);color:var(--sel-fg)}
.result-l{border:2px solid var(--text)}

.next-game-box{display:flex;align-items:center;justify-content:space-between;gap:12px}
.next-opponent{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:22px;line-height:28px;letter-spacing:.02em;text-transform:uppercase;min-width:0}
.next-details{text-align:right;font-family:var(--label);font-weight:600;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}

.no-data,.loading-text,.error-text{font-family:var(--label);font-weight:600;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase}
.loading-text{padding:12px 0;color:var(--muted)}
.error-text{display:inline-block;background:var(--live-bg);color:var(--live-fg);padding:5px 12px}

.standings-table{width:100%;border-collapse:collapse;border:2px solid var(--key);font-family:var(--label);font-size:14px;line-height:20px;letter-spacing:.02em}
.standings-table th{background:var(--head-bg);color:var(--head-text);font-weight:700;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;padding:6px 6px;text-align:right}
.standings-table th.rank-col,.standings-table th.s-team-col{text-align:left}
.standings-table td{padding:5px 6px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.standings-table tbody tr+tr{border-top:1px solid var(--divider)}
.standings-table tbody tr:nth-child(odd){background:var(--row-a)}
.standings-table tbody tr:nth-child(even){background:var(--row-b)}
.standings-table td.rank-col{text-align:left;width:20px;color:var(--muted)}
.standings-table td.s-team-col{text-align:left;font-weight:700}
.standings-table .logo-tile{width:20px;height:20px}
.standings-table tbody tr.is-us{background:var(--sel-bg);color:var(--sel-fg)}
.standings-table tr.is-us td{font-weight:700;color:var(--sel-fg)}
.standings-table td.s-team-col .logo-tile{vertical-align:middle;margin-right:6px}

footer{margin-top:56px;background:var(--foot-bg);color:var(--foot-text);border-top:3px solid var(--foot-line)}
.sources{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:28px var(--margin) 48px}
.sources a{display:inline-flex;align-items:center;min-height:32px;font-family:var(--label);font-weight:600;font-size:14px;color:inherit;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);transition:text-decoration-color .15s}
.sources a:focus-visible{outline-color:var(--foot-text)}
@media(hover:hover){.sources a:hover{text-decoration-color:currentColor}}

@media(max-width:960px){.dashboard{grid-template-columns:1fr}}
@container (max-width:560px){
  .team-body{flex-direction:column;gap:20px}
  .card-standings{width:100%;border-left:none;border-top:1px solid var(--key);padding:20px 0 0}
}
@media(max-width:700px){
  :root{--margin:16px}
  header{height:56px}
  .brand{font-size:24px;line-height:32px}
  .btn{padding:8px 14px}
  main{padding-top:24px}
  .masthead{padding:12px 16px}
  .masthead h1{font-size:28px;line-height:36px}
  .team-header{flex-wrap:wrap;padding:12px 16px}
  .team-info{flex-basis:calc(100% - 72px)}
  .team-badges{flex-basis:100%;justify-content:flex-start;margin-left:68px}
  .team-name{font-size:22px;line-height:28px}
  .team-body{padding:16px 16px 20px}
  body{margin:6px;min-height:calc(100vh - 12px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
    <a class="skip-link" href="#dashboard">Skip to content</a>
    <div class="top">
        <header>
            <a class="brand" href="/">amanvg</a>
            <nav class="tools" aria-label="Main navigation">
                <button class="btn icon-btn" id="mode" type="button" aria-label="Switch to dark mode">
                    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
                    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
            </nav>
        </header>
        <div class="stripes"></div>
    </div>
    <main>
        <div class="sheet">
            <div class="masthead">
                <h1>Seattle Sports</h1>
                <div class="header-right">
                    <span class="auto-refresh-label">Auto-refreshes every 30s</span>
                    <span id="last-updated"></span>
                    <button class="btn" id="refresh-btn" type="button" onclick="manualRefresh()">Refresh</button>
                </div>
            </div>
            <div id="dashboard" class="dashboard"></div>
        </div>
    </main>
    <footer>
        <div class="stripes"></div>
        <div class="sources"><a href="/trust/">Trust &amp; Sources</a></div>
    </footer>

    <script>
        // ── Configuration ───────────────────────────────────────

        const TEAMS = [
            {
                name: 'Seahawks', sport: 'football', league: 'nfl',
                primaryColor: '#002244', accentColor: '#69BE28',
                divisionName: 'NFC West',
                divisionTeams: ['SEA', 'SF', 'LAR', 'ARI'],
            },
            {
                name: 'Mariners', sport: 'baseball', league: 'mlb',
                primaryColor: '#0C2C56', accentColor: '#005C5C',
                divisionName: 'AL West',
                divisionTeams: ['SEA', 'HOU', 'TEX', 'LAA', 'OAK', 'ATH'],
            },
            {
                name: 'Kraken', sport: 'hockey', league: 'nhl',
                primaryColor: '#001628', accentColor: '#99D9D9',
                divisionName: 'Pacific',
                divisionTeams: ['SEA', 'VAN', 'CGY', 'EDM', 'LA', 'ANA', 'SJ', 'VGK'],
            },
            {
                name: 'Sounders', sport: 'soccer', league: 'usa.1',
                primaryColor: '#005595', accentColor: '#658D1B',
                divisionName: 'Western Conference',
                divisionTeams: null, // full conference
            },
        ];

        const STANDINGS_COLUMNS = {
            nfl:     [{ label: 'W', stat: 'wins' }, { label: 'L', stat: 'losses' }, { label: 'PCT', stat: 'winPercent' }],
            mlb:     [{ label: 'W', stat: 'wins' }, { label: 'L', stat: 'losses' }, { label: 'PCT', stat: 'winPercent' }, { label: 'GB', stat: 'gamesBehind' }],
            nhl:     [{ label: 'W', stat: 'wins' }, { label: 'L', stat: 'losses' }, { label: 'OTL', stat: 'otLosses' }, { label: 'PTS', stat: 'points' }],
            'usa.1': [{ label: 'W', stat: 'wins' }, { label: 'L', stat: 'losses' }, { label: 'D', stat: 'ties' }, { label: 'PTS', stat: 'points' }],
        };

        // Data comes from two places:
        //   · standings + schedule → data/snapshot.json, rebuilt by CI. site.api.espn.com
        //     sends no Access-Control-Allow-Origin, and proxying it through a Cloudflare
        //     Worker gets 403'd by ESPN's edge, so the browser never calls it at all.
        //   · live in-game scores → cdn.espn.com, which does still send CORS headers.
        const SNAPSHOT_URL = 'data/snapshot.json';
        const CDN = 'https://cdn.espn.com/core';

        // Where each league's in-progress games come from on cdn.espn.com.
        // NHL has no /scoreboard path there (it 404s, and ESPN doesn't put CORS
        // headers on error responses), but its /schedule payload carries the same
        // event shape keyed by date.
        const LIVE_SOURCES = {
            nfl:     { path: 'nfl/scoreboard?xhr=1' },
            mlb:     { path: 'mlb/scoreboard?xhr=1' },
            'usa.1': { path: 'soccer/scoreboard?xhr=1&league=usa.1' },
            nhl:     { path: 'nhl/schedule?xhr=1', fromSchedule: true },
        };

        let teamCache = {};
        let snapshot = null;
        let snapshotError = null;

        // ── Initialization ──────────────────────────────────────

        async function initialize() {
            renderSkeletons();
            await loadSnapshot();
            await refreshAll();
            setInterval(refreshAll, 30000);
            // The snapshot only moves when CI commits a new one, so poll it gently.
            setInterval(loadSnapshot, 5 * 60 * 1000);
        }

        async function loadSnapshot() {
            try {
                const res = await fetch(SNAPSHOT_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                snapshot = await res.json();
                snapshotError = null;
                for (const team of TEAMS) {
                    const t = snapshot.teams?.[team.name];
                    if (!t || t.error) continue;
                    team.id = t.id;
                    team.logo = t.logo;
                    team.abbreviation = t.abbreviation;
                    team.displayName = t.displayName;
                }
            } catch (e) {
                snapshotError = `Data unavailable (${e.message})`;
                console.error('Snapshot load failed:', e);
            }
        }

        // ── Data Fetching ───────────────────────────────────────

        async function refreshAll() {
            const live = await fetchLiveScores();
            for (const team of TEAMS) refreshTeam(team, live[team.league]);

            const now = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            const built = snapshot?.generatedAt
                ? ' · data ' + new Date(snapshot.generatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                : '';
            document.getElementById('last-updated').textContent = `Updated ${now}${built}`;
        }

        async function manualRefresh() {
            const btn = document.getElementById('refresh-btn');
            btn.textContent = '...';
            await loadSnapshot();
            await refreshAll();
            btn.textContent = 'Refresh';
        }

        function refreshTeam(team, liveEvents) {
            const entry = snapshot?.teams?.[team.name];

            if (snapshotError) {
                teamCache[team.name] = { error: snapshotError };
            } else if (!entry) {
                teamCache[team.name] = { error: 'Not in data snapshot' };
            } else if (entry.error) {
                teamCache[team.name] = { error: entry.error };
            } else {
                teamCache[team.name] = {
                    schedule: entry.schedule,
                    standings: entry.standings,
                    live: findLiveGame(team, liveEvents),
                };
            }
            renderCard(team);
        }

        // One request per league, shared by every team in that league.
        async function fetchLiveScores() {
            const leagues = [...new Set(TEAMS.map(t => t.league))];
            const out = {};
            await Promise.all(leagues.map(async league => {
                const src = LIVE_SOURCES[league];
                if (!src) return;
                try {
                    const res = await fetch(`${CDN}/${src.path}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    out[league] = src.fromSchedule
                        ? Object.values(data?.content?.schedule || {}).flatMap(d => d.games || [])
                        : (data?.content?.sbData?.events || []);
                } catch (e) {
                    // Non-critical: the card still renders from the snapshot, just
                    // without a live line on it.
                    console.warn(`Live scores unavailable for ${league}:`, e.message);
                }
            }));
            return out;
        }

        function findLiveGame(team, events) {
            for (const ev of events || []) {
                const comp = ev.competitions?.[0];
                if (comp?.status?.type?.state !== 'in') continue;
                if (comp.competitors?.some(c => String(c.team?.id) === String(team.id))) return ev;
            }
            return null;
        }

        // ── Helpers ─────────────────────────────────────────────

        function stat(entry, name) {
            if (!entry?.stats) return null;
            const s = entry.stats.find(s => s.name === name || s.abbreviation === name);
            return s ? (s.displayValue ?? String(s.value)) : null;
        }

        function formatRecord(team, entry) {
            if (!entry) return '';
            const w = stat(entry, 'wins'), l = stat(entry, 'losses');
            if (w == null && l == null) return '';

            if (team.league === 'nhl') {
                const otl = stat(entry, 'otLosses') || stat(entry, 'OTL');
                const pts = stat(entry, 'points');
                let r = `${w}-${l}`;
                if (otl) r += `-${otl}`;
                if (pts) r += `  \u00b7  ${pts} pts`;
                return r;
            }
            if (team.league === 'usa.1') {
                const t = stat(entry, 'ties') || stat(entry, 'draws');
                const pts = stat(entry, 'points');
                let r = `${w}-${l}`;
                if (t) r += `-${t}`;
                if (pts) r += `  \u00b7  ${pts} pts`;
                return r;
            }
            if (team.league === 'nfl') {
                const t = stat(entry, 'ties');
                let r = `${w}-${l}`;
                if (t && t !== '0') r += `-${t}`;
                return r;
            }
            return `${w}-${l}`;
        }

        function getScore(competitor) {
            const s = competitor.score;
            if (s == null) return '\u2014';
            if (typeof s === 'object') return s.displayValue ?? s.value ?? '\u2014';
            return String(s);
        }

        function getLogo(competitor) {
            return competitor.team?.logos?.[0]?.href || competitor.team?.logo || '';
        }

        function sortCompetitors(competitors) {
            return [...competitors].sort((a, b) => {
                if (a.homeAway === 'away' && b.homeAway !== 'away') return -1;
                if (b.homeAway === 'away' && a.homeAway !== 'away') return 1;
                return 0;
            });
        }

        function fmtDate(dateStr) {
            return new Date(dateStr).toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        // ── Rendering ───────────────────────────────────────────

        function renderSkeletons() {
            document.getElementById('dashboard').innerHTML = TEAMS.map(t => `
                <section class="team-card" id="card-${t.name}" style="--c:${t.primaryColor};--a:${t.accentColor}">
                    <div class="team-header">
                        <div class="team-info">
                            <h2 class="team-name">${t.name}</h2>
                            <div class="team-record">Loading</div>
                        </div>
                    </div>
                    <div class="accent-bar"></div>
                    <div class="team-body"><div class="loading-text">Fetching data</div></div>
                </section>
            `).join('');
        }

        function renderCard(team) {
            const el = document.getElementById(`card-${team.name}`);
            if (!el) return;
            const d = teamCache[team.name];

            if (d?.error) {
                el.innerHTML = `
                    <div class="team-header">
                        ${logoTile(team.logo, true)}
                        <div class="team-info">
                            <h2 class="team-name">${esc(team.displayName || team.name)}</h2>
                        </div>
                    </div>
                    <div class="accent-bar"></div>
                    <div class="team-body"><div class="error-text">${esc(d.error)}</div></div>`;
                return;
            }

            const { schedule, standings, live } = d || {};
            const record = formatRecord(team, standings?.teamEntry);
            const liveGame = live || schedule?.liveGame;
            const seasonPhase = schedule?.seasonPhase;
            const lastGame = schedule?.lastGame;
            const nextGame = schedule?.nextGame;

            // Left side: games
            let gamesBody = '';

            if (liveGame) {
                gamesBody += renderGame('live', liveGame, team);
            }

            if (lastGame) {
                gamesBody += renderGame('last', lastGame, team);
            } else if (!liveGame) {
                gamesBody += `<div><div class="section-label">Last Game</div><div class="no-data">No recent games</div></div>`;
            }

            if (nextGame) {
                gamesBody += renderNextGame(nextGame, team);
            } else {
                gamesBody += `<div><div class="section-label">Next Game</div><div class="no-data">No upcoming games scheduled</div></div>`;
            }

            // Right side: standings
            const standingsBody = renderStandings(team, standings);

            el.innerHTML = `
                <div class="team-header">
                    ${logoTile(team.logo, true)}
                    <div class="team-info">
                        <h2 class="team-name">${esc(team.displayName || team.name)}</h2>
                        <div class="team-record">${esc(record || 'Record unavailable')}</div>
                    </div>
                    <div class="team-badges">
                        ${liveGame ? '<div class="live-badge"><span class="live-dot"></span>LIVE</div>' : ''}
                        ${seasonPhase ? `<div class="season-badge ${esc(seasonPhase.cls)}">${esc(seasonPhase.label)}</div>` : ''}
                    </div>
                </div>
                <div class="accent-bar"></div>
                <div class="team-body">
                    <div class="card-games">${gamesBody}</div>
                    <div class="card-standings">${standingsBody}</div>
                </div>`;
        }

        function renderGame(type, event, team) {
            const comp = event.competitions?.[0];
            if (!comp) return '';

            const competitors = sortCompetitors(comp.competitors || []);
            const statusText = comp.status?.type?.shortDetail || comp.status?.type?.description || '';

            const us = comp.competitors?.find(c => String(c.team?.id) === String(team.id));
            const didWin = us?.winner;

            let label;
            if (type === 'live') {
                label = `<div class="section-label live-label"><span class="live-dot"></span>Live &mdash; ${esc(statusText)}</div>`;
            } else {
                label = `<div class="section-label">Last Game &mdash; ${fmtDate(event.date)}</div>`;
            }

            const rows = competitors.map(c => {
                const score = getScore(c);
                const logo = getLogo(c);
                const abbr = c.team?.abbreviation || c.team?.shortDisplayName || '?';
                let cls = 'game-team-row';
                if (type === 'last') {
                    cls += c.winner ? ' winner' : ' loser';
                }
                return `
                    <div class="${cls}">
                        ${logoTile(logo)}
                        <span class="game-team-name">${esc(abbr)}</span>
                        <span class="game-team-score">${esc(score)}</span>
                    </div>`;
            }).join('');

            let footer = '';
            if (type === 'last') {
                const resultCls = didWin ? 'result-w' : 'result-l';
                const resultTxt = didWin ? 'W' : 'L';
                footer = `
                    <div class="game-footer">
                        <span class="${resultCls}">${resultTxt}</span>
                        <span>${esc(statusText)}</span>
                    </div>`;
            }

            return `
                <div>
                    ${label}
                    <div class="game-box">
                        <div class="game-matchup">${rows}</div>
                        ${footer}
                    </div>
                </div>`;
        }

        function renderNextGame(event, team) {
            const comp = event.competitions?.[0];
            if (!comp) return '';

            const us = comp.competitors?.find(c => String(c.team?.id) === String(team.id));
            const opp = comp.competitors?.find(c => String(c.team?.id) !== String(team.id));

            const isHome = us?.homeAway === 'home';
            const prefix = isHome ? 'vs' : '@';
            const oppName = opp?.team?.abbreviation || opp?.team?.shortDisplayName || 'TBD';
            const oppLogo = getLogo(opp || {});

            const gd = new Date(event.date);
            const dateStr = gd.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
            const timeStr = gd.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

            const broadcast = comp.broadcasts?.[0]?.names?.[0] || '';

            return `
                <div>
                    <div class="section-label">Next Game</div>
                    <div class="next-game-box">
                        <div class="next-opponent">
                            ${logoTile(oppLogo)}
                            <span>${prefix} ${esc(oppName)}</span>
                        </div>
                        <div class="next-details">
                            <div>${esc(dateStr)}</div>
                            <div>${esc(timeStr)}${broadcast ? ' \u00b7 ' + esc(broadcast) : ''}</div>
                        </div>
                    </div>
                </div>`;
        }

        function renderStandings(team, standingsData) {
            if (!standingsData?.divisionEntries?.length) {
                return `
                    <div class="section-label">${esc(team.divisionName)}</div>
                    <div class="no-data">Standings unavailable</div>`;
            }

            const cols = STANDINGS_COLUMNS[team.league] || [];
            const entries = standingsData.divisionEntries;

            const headerCells = cols.map(c => `<th scope="col">${c.label}</th>`).join('');

            const rows = entries.map((entry, i) => {
                const isUs = String(entry.team?.id) === String(team.id);
                const logo = entry.team?.logos?.[0]?.href || '';
                const abbr = entry.team?.abbreviation || '?';

                const statCells = cols.map(c => {
                    let val = stat(entry, c.stat) || '\u2014';
                    return `<td>${esc(val)}</td>`;
                }).join('');

                return `
                    <tr class="${isUs ? 'is-us' : ''}">
                        <td class="rank-col">${i + 1}</td>
                        <td class="s-team-col">${logoTile(logo)}${esc(abbr)}</td>
                        ${statCells}
                    </tr>`;
            }).join('');

            return `
                <div class="section-label">${esc(team.divisionName)}</div>
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th class="rank-col" scope="col">#</th>
                            <th class="s-team-col" scope="col">Team</th>
                            ${headerCells}
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        // ESPN publishes a transparent 500-dark variant of each logo for dark grounds
        // (the team-colour header bands and the dark theme); light cards use the
        // standard logo. Falls back to the standard logo if a team has no dark one.
        function logoTile(url, onBand) {
            if (!url) return '';
            const dark = onBand || document.documentElement.dataset.theme === 'dark';
            const src = dark ? url.replace('/500/', '/500-dark/') : url;
            return `<span class="logo-tile"><img src="${esc(src)}" data-fallback="${esc(url)}" onerror="this.onerror=null;this.src=this.dataset.fallback" alt=""></span>`;
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ── Theme ───────────────────────────────────────────────

        const root = document.documentElement, mode = document.getElementById('mode');
        function paint() {
            mode.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            // Body logos depend on the theme, so redraw any card that has data.
            TEAMS.forEach(t => { if (teamCache[t.name]) renderCard(t); });
        }
        mode.addEventListener('click', () => {
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
            paint();
        });
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            let saved = null;
            try { saved = localStorage.getItem('theme'); } catch (x) {}
            if (saved === 'light' || saved === 'dark') return;
            root.dataset.theme = e.matches ? 'dark' : 'light';
            paint();
        });
        mode.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');

        // ── Go ──────────────────────────────────────────────────
        initialize();
    </script>
</body>
</html>
